<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="400" height="400" preserveAspectRatio="none" aria-hidden="true">
  <!-- 透明背景 -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- 主进度条：透明度90%的淡灰色竖矩形，模拟 Material Design 不确定进度条的长条动画 -->
  <rect x="0" y="0" width="0" height="900" fill="#acacac" opacity="0.6">
    <!-- x 位置：0 → 30% → 100% → 100% -->
    <animate 
      attributeName="x" 
      values="0; 270; 900; 900" 
      keyTimes="0; 0.5; 0.75; 1" 
      dur="2s" 
      repeatCount="indefinite" 
      calcMode="linear" 
    />
    <!-- 宽度：0 → 70% → 0 → 0 -->
    <animate 
      attributeName="width" 
      values="0; 630; 0; 0" 
      keyTimes="0; 0.5; 0.75; 1" 
      dur="2s" 
      repeatCount="indefinite" 
      calcMode="linear" 
    />
  </rect>

  <!-- 短条动画：延迟出现，快速滑出，模拟 Material Design 的短条效果 -->
  <rect x="0" y="0" width="0" height="900" fill="#acacac" opacity="0.6">
    <!-- x 位置：0 → 0 → 0 → 100% -->
    <animate 
      attributeName="x" 
      values="0; 0; 0; 900" 
      keyTimes="0; 0.5; 0.75; 1" 
      dur="2s" 
      repeatCount="indefinite" 
      calcMode="linear" 
    />
    <!-- 宽度：0 → 0 → 25% → 0 -->
    <animate 
      attributeName="width" 
      values="0; 0; 225; 0" 
      keyTimes="0; 0.5; 0.75; 1" 
      dur="2s" 
      repeatCount="indefinite" 
      calcMode="linear" 
    />
  </rect>
</svg>