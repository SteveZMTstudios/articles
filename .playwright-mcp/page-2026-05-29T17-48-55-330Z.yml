n class=\"line\"> vertex 1.0 0.0 0.0</span><br><span class=\"line\"> vertex 0.0 0.0 1.0</span><br><span class=\"line\"> endloop</span><br><span class=\"line\"> endfacet</span><br><span class=\"line\"> facet normal 0.0 0.0 -1.0</span><br><span class=\"line\"> outer loop</span><br><span class=\"line\"> vertex 0.0 0.0 0.0</span><br><span class=\"line\"> vertex 0.0 1.0 0.0</span><br><span class=\"line\"> vertex 1.0 0.0 0.0</span><br><span class=\"line\"> endloop</span><br><span class=\"line\"> endfacet</span><br><span class=\"line\"> facet normal -1.0 0.0 0.0</span><br><span class=\"line\"> outer loop</span><br><span class=\"line\"> vertex 0.0 0.0 0.0</span><br><span class=\"line\"> vertex 0.0 0.0 1.0</span><br><span class=\"line\"> vertex 0.0 1.0 0.0</span><br><span class=\"line\"> endloop</span><br><span class=\"line\"> endfacet</span><br><span class=\"line\"> facet normal 0.577 0.577 0.577</span><br><span class=\"line\"> outer loop</span><br><span class=\"line\"> vertex 1.0 0.0 0.0</span><br><span class=\"line\"> vertex 0.0 1.0 0.0</span><br><span class=\"line\"> vertex 0.0 0.0 1.0</span><br><span class=\"line\"> endloop</span><br><span class=\"line\"> endfacet</span><br><span class=\"line\">endsolid</span><br></pre></td></tr></table></figure><p>銆愭彁绀恒€慣ypora銆丱bsidian 涓嶆敮鎸� <code>geojson</code> 銆� <code>topojson</code> 鎴� <code>ASCII STL</code> 璇硶銆�</p><h3 id=\"鏁板琛ㄨ揪寮�\"><a href=\"#鏁板琛ㄨ揪寮�\" class=\"headerlink\" title=\"鏁板琛ㄨ揪寮�\"></a>鏁板琛ㄨ揪寮�</h3><p>鍐呰仈琛ㄨ揪寮忥細This sentence uses <code>$</code> delimiters to show math inline: $\\sqrt{3x-1}+(1+x)^2$</p><p>瑕佷互鍧楃殑褰㈠紡娣诲姞鏁板琛ㄨ揪寮忥紝璇峰惎鍔ㄤ竴涓柊琛岋紝骞朵娇鐢ㄤ袱涓編鍏冪鍙� <code>$$</code> 鍒嗛殧琛ㄨ揪寮忋€�</p><p>$$<br>\\left( \\sum_{k&#x3D;1}^n a_k b_k \\right)^2 \\leq \\left( \\sum_{k&#x3D;1}^n a_k^2 \\right) \\left( \\sum_{k&#x3D;1}^n b_k^2 \\right)<br>$$</p><p>鎴栬€咃紝鍙互浣跨敤 <code>math</code> 浠ｇ爜鍧楄娉曞皢鏁板琛ㄨ揪寮忔樉绀轰负鍧椼€� 浣跨敤姝よ娉曟椂锛屾棤闇€浣跨敤 <code>$$</code> 鍒嗛殧绗︺€傘€愭彁绀恒€慣ypora銆丱bsidian 涓嶆敮鎸併€�</p><figure class=\"highlight plaintext\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">\\sqrt&#123;3&#125;</span><br></pre></td></tr></table></figure><p>琛ㄧず缇庡厓绗﹀彿锛�</p><ul><li>鍦ㄦ暟瀛﹁〃杈惧紡鍐咃紝鍦ㄦ樉寮� <code>$</code> 涔嬪墠娣诲姞涓€涓� <code>\\</code> 绗﹀彿銆�<ul><li>This expression uses <code>\\$</code> to display a dollar sign: $\\sqrt{$4}$</li></ul></li><li>鍦ㄦ暟瀛﹁〃杈惧紡涔嬪锛屼絾鍦ㄥ悓涓€琛屼笂锛屽湪鏄惧紡 <code>$</code> 涓よ竟浣跨敤 span 鏍囪銆�<ul><li>To split <span>$</span>100 in half, we calculate $鈥�100&#x2F;2$</li><li>銆愭彁绀恒€慣ypora 涓嶆敮鎸併€�</li></ul></li></ul><p>濡傛灉浣犺繕鎯冲涔犳洿澶氾紝璇风湅 <a href=\"https://github.github.com/gfm/\">GitHub Flavored Markdown Spec</a></p><p>鍦ㄧ綉椤典笂浠ユ枃鏈殑褰㈠紡灞曠ず鏁板鍏紡锛屽彧闇€瑕佷竴涓� LaTeX 鐨勫瓙闆嗚兘娓叉煋鏁板鍏紡鍗冲彲銆侹aTeX 灏辨槸杩欐牱涓€涓敮鎸� HTML 鐨勮交閲忕骇鐨勬暟瀛﹀叕寮忓紩鎿庛€傚洜姝わ紝鍦ㄧ綉椤典腑缂栧啓鏁板鍏紡搴旀敞鎰忎娇鐢ㄥ吋瀹规€ф洿骞跨殑璇硶銆�</p><h1 id=\"Typora\"><a href=\"#Typora\" class=\"headerlink\" title=\"Typora\"></a>Typora</h1><p><strong>Typora</strong> 浣跨敤 GFM锛屽叾鐗硅壊鍦ㄤ簬鈥淲YSIWYG鈥濓紝鍏舵湁鑷繁鐗硅壊鐨勮娉曟覆鏌撱€�</p><p>浣跨敤绫� Setext 褰㈠紡 (<a href=\"https://en.wikipedia.org/wiki/Setext\">Setext - Wikipedia</a>) 鍒涘缓鏍囬銆傛敞鎰忎娇鐢� Shift+Enter 鎹㈣銆傦紙鏈夌嚎锛�</p><p>浣跨敤绫� Atx 褰㈠紡鍒涘缓鏍囬锛屼竴鍏卞彲浠ユ湁 6 涓骇鍒€傦紙浜曞彿锛�</p><p>浣跨敤 <code>[TOC]</code> 鍒涘缓鐩綍锛�</p><p>[TOC]</p><p>鍒嗗壊绾夸娇鐢ㄤ笁涓互涓婄鍙凤紙鏈€鍚庝竴涓娇鐢ㄤ簡鏍囩锛夈€傜鍙蜂腑闂村彲浠ユ彃鍏ョ┖鏍笺€�</p><hr><hr><hr><hr><hr><hr><hr /><p><kbd>Esc</kbd></p><p>娈佃惤鐨勬崲琛屾槸浣跨敤涓や釜浠ヤ笂鐨勭┖鏍煎姞鍥炶溅锛堝湪 Typora 缂栬緫鍣ㄩ噷鏄�<kbd>Shift</kbd>+<kbd>Enter</kbd>锛�</p><p>鎴栬€呬娇鐢� HTML 鏍囩<br>杩涜鎹㈣</p><p>涓嶈鍚濇儨鍥炶溅锛屽湪涓€浜涙儏鍐典笅鍥炶溅浼氳鍚炴帀锛�</p><p>浠ｇ爜鍧楀唴杩樿兘楂樹寒锛�</p><figure class=\"highlight plaintext\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br><span class=\"line\">3</span><br><span class=\"line\">4</span><br><span class=\"line\">5</span><br><span class=\"line\">6</span><br><span class=\"line\">7</span><br><span class=\"line\">8</span><br><span class=\"line\">9</span><br><span class=\"line\">10</span><br><span class=\"line\">11</span><br><span class=\"line\">12</span><br><span class=\"line\">13</span><br><span class=\"line\">14</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">Here&#x27;s an example:</span><br><span class=\"line\"></span><br><span class=\"line\">```js</span><br><span class=\"line\">function test() &#123;</span><br><span class=\"line\"> console.log(&quot;notice the blank line before this function?&quot;);</span><br><span class=\"line\">&#125;</span><br><span class=\"line\">```</span><br><span class=\"line\"></span><br><span class=\"line\">syntax highlighting:</span><br><span class=\"line\">```ruby</span><br><span class=\"line\">require &#x27;redcarpet&#x27;</span><br><span class=\"line\">markdown = Redcarpet.new(&quot;Hello World!&quot;)</span><br><span class=\"line\">puts markdown.to_html</span><br><span class=\"line\">```</span><br></pre></td></tr></table></figure><p>Typora now supports <a href=\"http://jekyllrb.com/docs/frontmatter/\">YAML Front Matter</a>. Input <code>---</code> at the top of the article and then press <code>Return</code> to introduce a metadata block. Alternatively, you can insert a metadata block from the top menu of Typora. 杩欓噷灏变笉婕旂ず浜嗗搱锛屽紕 Hexo 鐨勫枩闂讳箰瑙併€�</p><p>鏀寔鏈夋爣棰樼殑 Link锛岃瘯璇曢紶鏍囧仠鐣欏湪涓婇潰锛�<a href=\"http://example.com/\" title=\"Title\">an example</a></p><p>Typora allows you to insert URLs as links, wrapped by <code>&lt;</code>brackets<code>&gt;</code>.</p><p><code>&lt;i@typora.io&gt;</code> becomes <a href=\"mailto:&#105;&#x40;&#x74;&#121;&#x70;&#x6f;&#x72;&#97;&#x2e;&#105;&#111;\">i@typora.io</a>.</p><p>Typora will also automatically link standard URLs. e.g: <a href=\"http://www.google.com/\">www.google.com</a>. 灏辨槸娌℃湁浠讳綍鏍囪涔熻В鏋愬嚭鍦板潃浜嗐€�</p><p>Underline is powered by raw HTML.</p><p>鏀寔涓嬪垝绾匡細<code>&lt;u&gt;涓嬪垝绾�&lt;/u&gt;</code> becomes <u>涓嬪垝绾�</u>.</p><p>鏀寔涓婁笅鏍囷紙鍦ㄥ亸濂借缃腑璁剧疆锛夛細H<del>2</del>O X^2^</p><p>鏀寔楂樹寒锛�&#x3D;&#x3D;highlight&#x3D;&#x3D;</p><h1 id=\"Obsidian-Flavored-Markdown锛圤FM锛�\"><a href=\"#Obsidian-Flavored-Markdown锛圤FM锛�\" class=\"headerlink\" title=\"Obsidian Flavored Markdown锛圤FM锛�\">