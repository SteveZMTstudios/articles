o monitor for any further issues.<br>Nov 18, 2025 - 15:23 UTC<br>Update - Some customers may be still experiencing issues logging into or using the Cloudflare dashboard. We are working on a fix to resolve this, and continuing to monitor for any further issues.<br>Nov 18, 2025 - 14:57 UTC<br>Monitoring - A fix has been implemented and we believe the incident is now resolved. We are continuing to monitor for errors to ensure all services are back to normal.<br>Nov 18, 2025 - 14:42 UTC<br>Update - We鈥檝e deployed a change which has restored dashboard services. We are still working to remediate broad application services impact<br>Nov 18, 2025 - 14:34 UTC<br>Update - We are continuing to work on a fix for this issue.<br>Nov 18, 2025 - 14:22 UTC<br>Update - We are continuing working on restoring service for application services customers.<br>Nov 18, 2025 - 13:58 UTC<br>Update - We are continuing working on restoring service for application services customers.<br>Nov 18, 2025 - 13:35 UTC<br>Update - We have made changes that have allowed Cloudflare Access and WARP to recover. Error levels for Access and WARP users have returned to pre-incident rates.<br>We have re-enabled WARP access in London.</p><p>We are continuing to work towards restoring other services.<br>Nov 18, 2025 - 13:13 UTC<br>Identified - The issue has been identified and a fix is being implemented.<br>Nov 18, 2025 - 13:09 UTC<br>Update - During our attempts to remediate, we have disabled WARP access in London. Users in London trying to access the Internet via WARP will see a failure to connect.<br>Nov 18, 2025 - 13:04 UTC<br>Update - We are continuing to investigate this issue.<br>Nov 18, 2025 - 12:53 UTC<br>Update - We are continuing to investigate this issue.<br>Nov 18, 2025 - 12:37 UTC<br>Update - We are seeing services recover, but customers may continue to observe higher-than-normal error rates as we continue remediation efforts.<br>Nov 18, 2025 - 12:21 UTC<br>Update - We are continuing to investigate this issue.<br>Nov 18, 2025 - 12:03 UTC<br>Investigating - Cloudflare is experiencing an internal service degradation. Some services may be intermittently impacted. We are focused on restoring service. We will update as we are able to remediate. More updates to follow shortly.<br>Nov 18, 2025 - 11:48 UTC</p></details>]]> </content> <id>https://blog.stevezmt.top/2025/11/18/cloudflare-down/</id> <link href=\"https://blog.stevezmt.top/2025/11/18/cloudflare-down/\"/> <published>2025-11-18T13:57:56.000Z</published> <summary> <![CDATA[<p>2025骞�11鏈�18鏃� 11鐐�36鍒� (UTC鏃堕棿)锛孋loudflare鍙戠敓涓柇銆傛湁涓€璇翠竴锛岃繖娆loudflare鐨勪腑鏂奖鍝嶅疄鍦ㄦ槸澶ぇ浜嗐€�</p>]]> </summary> <title>50%鐨勪簰鑱旂綉鐖嗙偢浜�</title> <updated>2025-11-19T03:48:30.672Z</updated> <browser:html type=\"xhtml\"><div xmlns=\"http://www.w3.org/1999/xhtml\"><p>2025&#x5e74;11&#x6708;18&#x65e5; 11&#x70b9;36&#x5206; (UTC&#x65f6;&#x95f4;)&#xff0c;Cloudflare&#x53d1;&#x751f;&#x4e2d;&#x65ad;&#x3002;&#x6709;&#x4e00;&#x8bf4;&#x4e00;&#xff0c;&#x8fd9;&#x6b21;Cloudflare&#x7684;&#x4e2d;&#x65ad;&#x5f71;&#x54cd;&#x5b9e;&#x5728;&#x662f;&#x592a;&#x5927;&#x4e86;&#x3002;</p><span id=\"more\"/><p><img src=\"/images/blog/cloudflare-down/offline_compressed.jpg\" alt=\"alt text\" title=\"Cloudflare &#x5927;&#x9762;&#x79ef;&#x7f51;&#x7edc;&#x4e2d;&#x65ad;\"/></p><p>&#x4eca;&#x5e74;&#x7684;&#x4e91;&#x670d;&#x52a1;&#x771f;&#x662f;&#x591a;&#x707e;&#x591a;&#x96be;&#xff0c;&#x5148;&#x662f;Google cloud&#x5b95;&#x673a;&#xff0c;&#x7d27;&#x63a5;&#x7740;&#x5c31;&#x662f;AWS</p><p>AWS&#x5b8c;&#x4e86;&#x4e4b;&#x540e;&#x53c8;&#x662f;&#x8f6e;&#x5230;&#x4e86;&#x6211;&#x4eec;&#x7684;&#x5fae;&#x8f6f;Azure&#xff0c; &#x7136;&#x540e;&#x9a6c;&#x4e0d;&#x505c;&#x8e44;&#x5730;&#x53c8;&#x662f;&#x6211;&#x4eec;&#x7684;b&#x7ad9;</p><p>&#x5b8c;&#x4e8b;&#x8d85;&#x661f;&#x5b66;&#x4e60;&#x901a;&#x4e5f;&#x7206;&#x4e86;</p><p>&#x597d;&#x4e86;&#x8fd8;&#x4e0d;&#x5230;&#x4e00;&#x5929;&#xff0c;Cloudflare&#x53c8;&#x6302;&#x4e86;&#x3002;</p><p>Cloudflare&#x4f5c;&#x4e3a;&#x5168;&#x7403;&#x6700;&#x5927;&#x7684;CD