nux-tools/*-generic/usbip 20</span><br></pre></td></tr></table></figure><ol start=\"2\"><li>缁戝畾骞惰繛鎺� Yubikey<br>鍦� Windows 绠＄悊鍛� PowerShell 涓壘鍒� Yubikey锛�</li></ol><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br></pre></td><td class=\"code\"><pre><span class=\"line\"></span><br><span class=\"line\">usbipd list</span><br></pre></td></tr></table></figure><p>鎵惧埌绫讳技 1050:0407 Yubikey 4&#x2F;5 OTP+U2F+CCID 鐨勮锛岃涓嬪叾 BUSID锛堜緥濡� 4-1锛夈€�</p><p>缁戝畾璁惧锛堝彧闇€鎿嶄綔涓€娆★級锛�</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">usbipd bind <span class=\"literal\">--busid</span> <span class=\"number\">4</span><span class=\"literal\">-1</span></span><br></pre></td></tr></table></figure><p>杩炴帴鍒� WSL锛�</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">usbipd attach <span class=\"literal\">--wsl</span> <span class=\"literal\">--busid</span> <span class=\"number\">4</span><span class=\"literal\">-1</span></span><br></pre></td></tr></table></figure><p>娉細杩炴帴鍚庯紝Windows 渚у皢鏆傛椂鏃犳硶璇嗗埆璇� Yubikey锛岀洿鍒颁綘鎵ц detach 銆�</p><ol start=\"3\"><li>鍦� WSL 涓厤缃� GPG 绛惧悕<br>杩炴帴鎴愬姛鍚庯紝鍦� WSL 涓墽琛� lsusb锛屼綘搴旇鑳界湅鍒� Yubikey銆�</li></ol><p>纭繚鏅鸿兘鍗℃湇鍔¤繍琛�</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br></pre></td><td class=\"code\"><pre><span class=\"line\"><span class=\"built_in\">sudo</span> apt install scdaemon pcscd</span><br><span class=\"line\"><span class=\"built_in\">sudo</span> service pcscd start</span><br></pre></td></tr></table></figure><p>妫€鏌ュ崱鐗囩姸鎬侊細</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">gpg --card-status</span><br></pre></td></tr></table></figure><p>濡傛灉杈撳嚭浜嗕綘鐨� Key 淇℃伅锛堝寘鎷� Signature key 鐨� ID锛夛紝璇存槑纭欢閾捐矾宸查€氥€�</p><p>閰嶇疆 Git 浣跨敤璇� Key锛�<br>鑾峰彇 Key ID锛�<code>gpg --list-secret-keys --keyid-format aaaaaaaaaaaaaaaaaaaaa</code></p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br><span class=\"line\">3</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">git config --global user.signingkey 3745872A953198FE</span><br><span class=\"line\"></span><br><span class=\"line\">git config --global commit.gpgsign <span class=\"literal\">true</span></span><br></pre></td></tr></table></figure><p>娴嬭瘯绛惧悕 Commit锛�</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">git commit -S -m <span class=\"string\">&quot;signed commit via usbipd&quot;</span></span><br></pre></td></tr></table></figure><p>姝ゆ椂 WSL 鍐呴儴浼氳皟鐢� scdaemon 璁块棶 USB 纭欢銆�</p><p>杩欎箞鍋氫笉浠呯湅杩愭皵鍜岀幆澧冿紝鑰屼笖寮圭獥涔熸瘮杈冮夯鐑︺€�</p><p>浣嗘槸鏈夋椂锛堟瘮濡傜敤linux鐑у浐浠讹級鍙兘杩欎箞骞层€�</p><h3 id=\"杩欏張鏄€庝箞杩愪綔鐨勶紵\"><a href=\"#杩欏張鏄€庝箞杩愪綔鐨勶紵\" class=\"headerlink\" title=\"杩欏張鏄€庝箞杩愪綔鐨勶紵\"></a>杩欏張鏄€庝箞杩愪綔鐨勶紵</h3><p>杩欎釜瑙ｉ噴璧锋潵绋嶅井绠€鍗曚竴鐐癸細</p><p>璇镐綅鑲畾閮界敤杩噓sb杞彂鍣ㄥ惂銆�</p><p>瀹冨氨鐩稿綋浜庡€熷姪<code>usbipd</code>杩欎釜杞彂鍣紝鎶婁綘鐨勭‖浠朵粠windows涓婃嫈涓嬫潵鎻掑湪usbipd杩欎釜寤堕暱绾夸笂銆備箣鍚庣殑椹卞姩鍜屾搷浣滃畬鍏ㄧ敱linux鎺у埗銆�</p><h2 id=\"缁撹\"><a href=\"#缁撹\" class=\"headerlink\" title=\"缁撹\"></a>缁撹</h2><p>wsl寰堝彲鑳芥槸<del>microslop</del>Microsoft杩欏嚑骞翠负鏁颁笉澶氬仛鐨勮繕绠椾汉浜嬬殑涓滆タ銆�</p>]]> </content> <id>https://blog.stevezmt.top/2026/04/13/wsl-gpg.exe/</id> <link href=\"https://blog.stevezmt.top/2026/04/13/wsl-gpg.exe/\"/> <published>2026-04-13T07:59:34.000Z</published> <summary>杩欎簨鏄庢槑寰堢畝鍗曠殑锛屾€庝箞缁欎簰鑱旂綉鍜屾妧鏈ぇ鐗涙悶寰楄繖涔堝鏉傦紵</summary> <title>WSL涓浣曢『鐣呭湴浣跨敤GPG鍜孻ubikey杩欑被涓滆タ</title> <updated>2026-05-29T02:30:10.333Z</updated> <browser:html type=\"xhtml\"><div xmlns=\"http://www.w3.org/1999/