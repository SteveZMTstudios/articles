&quot;type&quot;: &quot;Point&quot;,</span><br/><span class=\"line\"> &quot;properties&quot;: {&quot;prop0&quot;: &quot;value0&quot;},</span><br/><span class=\"line\"> &quot;coordinates&quot;: [4000, 5000]</span><br/><span class=\"line\"> },</span><br/><span class=\"line\"> {</span><br/><span class=\"line\"> &quot;type&quot;: &quot;LineString&quot;,</span><br/><span class=\"line\"> &quot;properties&quot;: {&quot;prop0&quot;: &quot;value0&quot;, &quot;prop1&quot;: 0},</span><br/><span class=\"line\"> &quot;arcs&quot;: [0]</span><br/><span class=\"line\"> },</span><br/><span class=\"line\"> {</span><br/><span class=\"line\"> &quot;type&quot;: &quot;Polygon&quot;,</span><br/><span class=\"line\"> &quot;properties&quot;: {&quot;prop0&quot;: &quot;value0&quot;,</span><br/><span class=\"line\"> &quot;prop1&quot;: {&quot;this&quot;: &quot;that&quot;}</span><br/><span class=\"line\"> },</span><br/><span class=\"line\"> &quot;arcs&quot;: [[1]]</span><br/><span class=\"line\"> }</span><br/><span class=\"line\"> ]</span><br/><span class=\"line\"> }</span><br/><span class=\"line\"> },</span><br/><span class=\"line\"> &quot;arcs&quot;: [[[4000, 0], [1999, 9999], [2000, -9999], [2000, 9999]],[[0, 0], [0, 9999], [2000, 0], [0, -9999], [-2000, 0]]]</span><br/><span class=\"line\">}</span><br/></pre></td></tr></table></figure><p>GFM &#x53ef;&#x4ee5;&#x76f4;&#x63a5;&#x5728; Markdown &#x4e2d;&#x4f7f;&#x7528; ASCII STL &#x8bed;&#x6cd5;&#x6765;&#x521b;&#x5efa;&#x4ea4;&#x4e92;&#x5f0f; 3D &#x6a21;&#x578b;&#x3002; &#x82e5;&#x8981;&#x663e;&#x793a;&#x6a21;&#x578b;&#xff0c;&#x8bf7;&#x4f7f;&#x7528; <code>stl</code> &#x8bed;&#x6cd5;&#x6807;&#x8bc6;&#x7b26;&#x5728;&#x56f4;&#x680f;&#x4ee3;&#x7801;&#x5757;&#x4e2d;&#x6dfb;&#x52a0; ASCII STL &#x8bed;&#x6cd5;&#x3002;&#x5982;&#x679c;&#x4f60;&#x7684; Markdown &#x6e32;&#x67d3;&#x5668;&#x652f;&#x6301;&#x6e32;&#x67d3;&#x7684;&#x8bdd;&#xff0c;&#x5e94;&#x8be5;&#x770b;&#x5230;&#x4e00;&#x4e2a;&#x7acb;&#x65b9;&#x4f53;&#x800c;&#x4e0d;&#x662f;&#x4ee3;&#x7801;&#x5757;&#x3002;</p><figure class=\"highlight plaintext\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/><span class=\"line\">3</span><br/><span class=\"line\">4</span><br/><span class=\"line\">5</span><br/><span class=\"line\">6</span><br/><span class=\"line\">7</span><br/><span class=\"line\">8</span><br/><span class=\"line\">9</span><br/><span class=\"line\">10</span><br/><span class=\"line\">11</span><br/><span class=\"line\">12</span><br/><span class=\"line\">13</span><br/><span class=\"line\">14</span><br/><span class=\"line\">15</span><br/><span class=\"line\">16</span><br/><span class=\"line\">17</span><br/><span class=\"line\">18</span><br/><span class=\"line\">19</span><br/><span class=\"line\">20</span><br/><span class=\"line\">21</span><br/><span class=\"line\">22</span><br/><span class=\"line\">23</span><br/><span class=\"line\">24</span><br/><span class=\"line\">25</span><br/><span class=\"line\">26</span><br/><span class=\"line\">27</span><br/><span class=\"line\">28</span><br/><span class=\"line\">29</span><br/><span class=\"line\">30</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">solid cube_corner</span><br/><span class=\"line\"> facet normal 0.0 -1.0 0.0</span><br/><span class=\"line\"> outer loop</span><br/><span class=\"line\"> vertex 0.0 0.0 0.0</span><br/><span class=\"line\"> vertex 1.0 0.0 0.0</span><br/><span class=\"line\"> vertex 0.0 0.0 1.0</span><br/><span class=\"line\"> endloop</span><br/><span class=\"line\"> endfacet</span><br/><span class=\"line\"> facet normal 0.0 0.0 -1.0</span><br/><span class=\"line\"> outer loop</span><br/><span class=\"line\"> vertex 0.0 0.0 0.0</span><br/><span class=\"line\"> vertex 0.0 1.0 0.0</span><br/><span class=\"line\"> vertex 1.0 0.0 0.0</span><br/><span class=\"line\"> endloop</span><br/><span class=\"line\"> endfacet</span><br/><span class=\"line\"> facet normal -1.0 0.0 0.0</span><br/><span class=\"line\"> outer loop</span><br/><span class=\"line\"> vertex 0.0 0.0 0.0</span><br/><span class=\"line\"> vertex 0.0 0.0 1.0</span><br/><span class=\"line\"> vertex 0.0 1.0 0.0</span><br/><span class=\"line\"> endloop</span><br/><span class=\"line\"> endfacet</span><br/><span class=\"line\"> facet normal 0.577 0.577 0.577</span><br/><span class=\"line\"> outer loop</span><br/><span class=\"line\"> vertex 1.0 0.0 0.0</span><br/><span class=\"line\"> vertex 0.0 1.0 0.0</span><br/><span class=\"line\"> vertex 0.0 0.0 1.0</span><br/><span class=\"line\"> endloop</span><br/><span class=\"line\"> endfacet</span><br/><span class=\"line\">endsolid</span><br/></pre></td></tr></table></figure><p>&#x3010;&#x63d0;&#x793a;&#x3011;Typora&#x3001;Obsidian &#x4e0d;&#x652f;&#x6301; <code>geojson</code> &#x3001; <code>topojson</code> &#x6216; <code>ASCII STL</code> &#x8bed;&#x6cd5;&#x3002;</p><h3 id=\"&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;\"><a href=\"#&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;\" class=\"headerlink\" title=\"&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;\"/>&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;</h3><p>&#x5185;&#x8054;&#x8868;&#x8fbe;&#x5f0f;&#xff1a;This sentence uses <code>&#x24;</code> delimiters to show math inline: &#x24;\\sqrt{3x-1}+(1+x)^2&#x24;</p><p>&#x8981;&#x4ee5;&#x5757;&#x7684;&#x5f62;&#x5f0f;&#x6dfb;&#x52a0;&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;&#xff0c;&#x8bf7;&#x542f;&#x52a8;&#x4e00;&#x4e2a;&#x65b0;&#x884c;&#xff0c;&#x5e76;&#x4f7f;&#x7528;&#x4e24;&#x4e2a;&#x7f8e;&#x5143;&#x7b26;&#x53f7; <code>&#x24;&#x24;</code> &#x5206;&#x9694;&#x8868;&#x8fbe;&#x5f0f;&#x3002;</p><p>&#x24;&#x24;<br/>\\left( \\sum_{k=1}^n a_k b_k \\right)^2 \\leq \\left( \\sum_{k=1}^n a_k^2 \\right) \\left( \\sum_{k=1}^n b_k^2 \\right)<br/>&#x24;&#x24;</p><p>&#x6216;&#x8005;&#xff0c;&#x53ef;&#x4ee5;&#x4f7f;&#x7528; <code>math</code> &#x4ee3;&#x7801;&#x5757;&#x8bed;&#x6cd5;&#x5c06;&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;&#x663e;&#x793a;&#x4e3a;&#x5757;&#x3002; &#x4f7f;&#x7528;&#x6b64;&#x8bed;&#x6cd5;&#x65f6;&#xff0c;&#x65e0;&#x9700;&#x4f7f;&#x7528; <code>&#x24;&#x24;</code> &#x5206;&#x9694;&#x7b26;&#x3002;&#x3010;&#x63d0;&#x793a;&#x3011;Typora&#x3001;Obsidian &#x4e0d;&#x652f;&#x6301;&#x3002;</p><figure class=\"highlight plaintext\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">\\sqrt{3}</span><br/></pre></td></tr></table></figure><p>&#x8868;&#x793a;&#x7f8e;&#x5143;&#x7b26;&#x53f7;&#xff1a;</p><ul><li>&#x5728;&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;&#x5185;&#xff0c;&#x5728;&#x663e;&#x5f0f; <code>&#x24;</code> &#x4e4b;&#x524d;&#x6dfb;&#x52a0;&#x4e00;&#x4e2a; <code>\\</code> &#x7b26;&#x53f7;&#x3002;<ul><li>This expression uses <code>\\&#x24;</code> to display a dollar sign: &#x24;\\sqrt{&#x24;4}&#x24;</li></ul></li><li>&#x5728;&#x6570;&#x5b66;&#x8868;&#x8fbe;&#x5f0f;&#x4e4b;&#x5916;&#xff0c;&#x4f46;&#x5728;&#x540c;&#x4e00;&#x884c;&#x4e0a;&#xff0c;&#x5728;&#x663e;&#x5f0f; <code>&#x24;</code> &#x4e24;&#x8fb9;&#x4f7f;&#x7528; span &#x6807;&#x8bb0;&#x3002;<ul><li>To split <span>&#x24;</span>100 in half, we calculate &#x24;&#x200b;100/2&#x24;</li><li>&#x3010;&#x63d0;&#x793a;&#x3011;Typora &#x4e0d;&#x652f;&#x6301;&#x3002;</li></ul></li></ul><p>&#x5982;&#x679c;&#x4f60;&#x8fd8;&#x60f3;&#x5b66;&#x4e60;&#x66f4;&#x591a;&#xff0c;&#x8bf7;&#x770b; <a href=\"https://github.github.com/gfm/\">GitHub Flavored Markdown Spec</a></p><p>&#x5728;&#x7f51;&#x9875;&#x4e0a;&#x4ee5;&#x6587;&#x672c;&#x7684;&#x5f62;&#x5f0f;&#x5c55;&#x793a;&#x6570;&#x5b66;&#x516c;&#x5f0f;&#xff0c;&#x53ea;&#x9700;&#x8981;&#x4e00;&#x4e2a; LaTeX &#x7684;&#x5b50;&#x96c6;&#x80fd;&#x6e32;&#x67d3;&#x6570;&#x5b66;&#x516c;&#x5f0f;&#x5373;&#x53ef;&#x3002;KaTeX &#x5c31;&#x662f;&#x8fd9;&#x6837;&#x4e00;&#x4e2a;&#x652f;&#x6301; HTML &#x7684;&#x8f7b;&#x91cf;&#x7ea7;&#x7684;&#x6570;&#x5b66;&#x516c;&#x5f0f;&#x5f15;&#x64ce;&#x3002;&#x56e0;&#x6b64;&#xff0c;&#x5728;&#x7f51;&#x9875;&#x4e2d;&#x7f16;&#x5199;&#x6570;&#x5b66;&#x516c;&#x5f0f;&#x5e94;&#x6ce8;&#x610f;&#x4f7f;&#x7528;&#x517c;&#x5bb9;&#x6027;&#x66f4;&#x5e7f;&#x7684;&#x8bed;&#x6cd5;&#x3002;</p><h1 id=\"Typora\"><a href=\"#Typora\" class=\"headerlink\" title=\"Typora\"/>Typora</h1><p><strong>Typora</strong> &#x4f7f;&#x7528; GFM&#xff0c;&#x5176;&#x7279;&#x8272;&#x5728;&#x4e8e;&#x201c;WYSIWYG&#x201d;&#xff0c;&#x5176;&#x6709;&#x81ea;&#x5df1;&#x7279;&#x8272;&#x7684;&#x8bed;&#x6cd5;&#x6e32;&#x67d3;&#x3002;</p><p>&#x4f7f;&#x7528;&#x7c7b; Setext &#x5f62;&#x5f0f; (<a href=\"https://en.wikipedia.org/wiki/Setext\">Setext - Wikipedia</a>) &#x521b;&#x5efa;&#x6807;&#x9898;&#x3002;&#x6ce8;&#x610f;&#x4f7f;&#x7528; Shift+Enter &#x6362;&#x884c;&#x3002;&#xff08;&#x6709;&#x7ebf;&#xff09;</p><p>&#x4f7f;&#x7528;&#x7c7b; Atx &#x5f62;&#x5f0f;&#x521b;&#x5efa;&#x6807;&#x9898;&#xff0c;&#x4e00;&#x5171;&#x53ef;&#x4ee5;&#x6709; 6 &#x4e2a;&#x7ea7;&#x522b;&#x3002;&#xff08;&#x4e95;&#x53f7;&#xff09;</p><p>&#x4f7f;&#x7528; <code>[TOC]</code> &#x521b;&#x5efa;&#x76ee;&#x5f55;&#xff1a;</p><p>[TOC]</p><p>&#x5206;&#x5272;&#x7ebf;&#x4f7f;&#x7528;&#x4e09;&#x4e2a;&#x4ee5;&#x4e0a;&#x7b26;&#x53f7;&#xff08;&#x6700;&#x540e;&#x4e00;&#x4e2a;&#x4f7f;&#x7528;&#x4e86;&#x6807;&#x7b7e;&#xff09;&#x3002;&#x7b26;&#x53f7;&#x4e2d;&#x95f4;&#x53ef;&#x4ee5;&#x63d2;&#x5165;&#x7a7a;&#x683c;&#x3002;</p><hr/><hr/><hr/><hr/><hr/><hr/><hr/><p><kbd>Esc</kbd></p><p>&#x6bb5;&#x843d;&#x7684;&#x6362;&#x884c;&#x662f;&#x4f7f;&#x7528;&#x4e24;&#x4e2a;&#x4ee5;&#x4e0a;&#x7684;&#x7a7a;&#x683c;&#x52a0;&#x56de;&#x8f66;&#xff08;&#x5728; Typora &#x7f16;&#x8f91;&#x5668;&#x91cc;&#x662f;<kbd>Shift</kbd>+<kbd>Enter</kbd>&#xff09;</p><p>&#x6216;&#x8005;&#x4f7f;&#x7528; HTML &#x6807;&#x7b7e;<br/>&#x8fdb;&#x884c;&#x6362;&#x884c;</p><p>&#x4e0d;&#x8981;&#x541d;&#x60dc;&#x56de;&#x8f66;&#xff0c;&#x5728;&#x4e00;&#x4e9b;&#x60c5;&#x51b5;&#x4e0b;&#x56de;&#x8f66;&#x4f1a;&#x88ab;&#x541e;&#x6389;&#xff01;</p><p>&#x4ee3;&#x7801;&#x5757;&#x5185;&#x8fd8;&#x80fd;&#x9ad8;&#x4eae;&#xff1a;</p><figure class=\"highlight plaintext\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/><span class=\"line\">3</span><br/><span class=\"line\">4</span><br/><span class=\"line\">5</span><br/><span class=\"line\">6</span><br/><span class=\"line\">7</span><br/><span class=\"line\">8</span><br/><span class=\"line\">9</span><br/><span class=\"line\">10</span><br/><span class=\"line\">11</span><br/><span class=\"line\">12</span><br/><span class=\"line\">13</span><br/><span class=\"line\">14</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">Here&apos;s an example:</span><br/><span class=\"line\"/><br/><span class=\"line\">```js</span><br/><span class=\"line\">function test() {</span><br/><span class=\"line\"> console.log(&quot;notice the blank line before this function?&quot;);</span><br/><span class=\"line\">}</span><br/><span class=\"line\">```</span><br/><span class=\"line\"/><br/><span class=\"line\">syntax highlighting:</span><br/><span class=\"line\">```ruby</span><br/><span class=\"line\">require &apos;redcarpet&apos;</span><br/><span class=\"line\">markdown = Redcarpet.new(&quot;Hello World!&quot;)</span><br/><span class=\"line\">puts markdown.to_html</span><br/><span class=\"line\">```</span><br/></pre></td></tr></table></figure><p>Typora now supports <a href=\"http://jekyllrb.com/docs/frontmatter/\">YAML Front Matter</a>. Input <code>---</code> at the top of the article and then press <code>Return</code> to introduce a metadata block. Alternatively, you can insert a metadata block from the top menu of Typora. &#x8fd9;&#x91cc;&#x5c31;&#x4e0d;&#x6f14;&#x793a;&#x4e86;&#x54c8;&#xff0c;&#x5f04; Hexo &#x7684;&#x559c;&#x95fb;&#x4e50;&#x89c1;&#x3002;</p><p>&#x652f;&#x6301;&#x6709;&#x6807;&#x9898;&#x7684; Link&#xff0c;&#x8bd5;&#x8bd5;&#x9f20;&#x6807;&#x505c;&#x7559;&#x5728;&#x4e0a;&#x9762;&#xff1a;<a href=\"http://example.com/\" title=\"Title\">an example</a></p><p>Typora allows you to insert URLs as links, wrapped by <code>&lt;</code>brackets<code>&gt;</code>.</p><p><code>&lt;i@typora.io&gt;</code> becomes <a href=\"mailto:i@typora.io\">i@typora.io</a>.</p><p>Typora will also automatically link standard URLs. e.g: <a href=\"http://www.google.com/\">www.google.com</a>. &#x5c31;&#x662f;&#x6ca1;&#x6709;&#x4efb;&#x4f55;&#x6807;&#x8bb0;&#x4e5f;&#x89e3;&#x6790;&#x51fa;&#x5730;&#x5740;&#x4e86;&#x3002;</p><p>Underline is powered by raw HTML.</p><p>&#x652f;&#x6301;&#x4e0b;&#x5212;&#x7ebf;&#xff1a;<code>&lt;u&gt;&#x4e0b;&#x5212;&#x7ebf;&lt;/u&gt;</code> becomes <u>&#x4e0b;&#x5212;&#x7ebf;</u>.</p><p>&#x652f;&#x6301;&#x4e0a;&#x4e0b;&#x6807;&#xff08;&#x5728;&#x504f;&#x597d;&#x8bbe;&#x7f6e;&#x4e2d;&#x8bbe;&#x7f6e;&#xff09;&#xff1a;H<del>2</del>O X^2^</p><p>&#x652f;&#x6301;&#x9ad8;&#x4eae;&#xff1a;==highlight==</p><h1 id=\"Obsidian-Flavored-Markdown&#xff08;OFM&#xff09;\"><a href=\"#Obsidian-Flavored-Markdown&#xff08;OFM&#xff09;\" class=\"headerlink\" title=\"Obsidian Flavored Markdown&#xff08;OFM&#xff09;\"/>Obsidian Flavored Markdown&#xff08;OFM&#xff09;</h1><p>Obsidian &#x662f;&#x4e00;&#x4e2a;&#x57fa;&#x4e8e; Markdown &#x8fdb;&#x884c;&#x8bb0;&#x5f55;&#x7684;&#x77e5;&#x8bc6;&#x5e93;&#x8f6f;&#x4ef6;&#xff0c;&#x7279;&#x70b9;&#x5728;&#x4e8e;&#x652f;&#x6301;&#x7b14;&#x8bb0;&#x7684;&#x53cc;&#x5411;&#x94fe;&#x63a5;&#x3002;&#x56e0;&#x6b64;&#xff0c;&#x6709;&#x81ea;&#x5df1;&#x7684;&#x72ec;&#x7279;&#x8bed;&#x6cd5;&#x3002;</p><p>Obsidian &#x52aa;&#x529b;&#x8ba9; Obsidian &#x7684;&#x8bed;&#x6cd5;&#x4e0d;&#x504f;&#x79bb;&#x6b63;&#x7edf;&#x7684; Markdown &#x8bed;&#x6cd5;&#x592a;&#x591a;&#x3002;&#x603b;&#x7684;&#x6765;&#x770b;&#xff0c;Obsidian &#x7684;&#x8bed;&#x6cd5;&#x5927;&#x591a;&#x8fd8;&#x662f;&#x57fa;&#x4e8e; CommonMark&#xff0c;&#x5305;&#x62ec;&#x4e86;&#x4e00;&#x4e9b; GitHub Flavored Markdown&#xff08;GFM&#xff09;&#x548c; LaTeX&#xff0c;&#x4ee5;&#x53ca; Obsidian<strong>&#x7279;&#x6709;&#x7684;</strong>&#x8bed;&#x6cd5;&#x3002;</p><table><thead><tr><th>Syntax</th><th>Description</th></tr></thead><tbody><tr><td><strong>[[ ]]</strong></td><td><a href=\"https://help.obsidian.md/Linking+notes+and+files/Internal+links\">Internal links</a></td></tr><tr><td><strong>![[ ]]</strong></td><td><a href=\"https://help.obsidian.md/Linking+notes+and+files/Embedding+files\">Embedding files</a></td></tr><tr><td><code>%%</code></td><td><a href=\"https://help.obsidian.md/Editing+and+formatting/Basic+formatting+syntax#Comments\">Comments</a></td></tr><tr><td><code>&gt; [!note]</code></td><td><a href=\"https://help.obsidian.md/Editing+and+formatting/Callouts\">Callouts</a></td></tr></tbody></table><p>&#x63d0;&#x793a;&#xff1a;&#x4e3a;&#x9632;&#x6b62;&#x5176;&#x4ed6;&#x63d2;&#x4ef6;&#x5f71;&#x54cd;&#xff0c;Embedding files &#x7684;&#x793a;&#x4f8b;&#x542b;&#x8f6c;&#x4e49;&#x5b57;&#x7b26;&#x3002;</p><p>Obsidian doesn&#x2019;t support Markdown syntax or blank lines within HTML blocks.</p><p>&#x53c2;&#x8003;&#xff1a;</p><ul><li><a href=\"https://publish.obsidian.md/help-zh/%E4%BD%BF%E7%94%A8%E6%8C%87%E5%8D%97/%E6%A0%BC%E5%BC%8F%E5%8C%96%E4%BD%A0%E7%9A%84%E7%AC%94%E8%AE%B0\">&#x683c;&#x5f0f;&#x5316;&#x4f60;&#x7684;&#x7b14;&#x8bb0; - Obsidian &#x4e2d;&#x6587;&#x5e2e;&#x52a9; - Obsidian Publish</a></li><li><a href=\"https://help.obsidian.md/Editing+and+formatting/Obsidian+Flavored+Markdown\">Obsidian Flavored Markdown - Obsidian Help</a></li></ul><h2 id=\"Internal-links-&#x5185;&#x90e8;&#x94fe;&#x63a5;\"><a href=\"#Internal-links-&#x5185;&#x90e8;&#x94fe;&#x63a5;\" class=\"headerlink\" title=\"Internal links &#x5185;&#x90e8;&#x94fe;&#x63a5;\"/>Internal links &#x5185;&#x90e8;&#x94fe;&#x63a5;</h2><p>&#x901a;&#x8fc7; <strong>[[ ]]</strong> &#x6765;&#x94fe;&#x63a5;&#x5e93;&#x4e2d;&#x4efb;&#x610f;&#x4e00;&#x4e2a;&#x6587;&#x4ef6;&#x3002;</p><p>&#x94fe;&#x63a5;&#x4e00;&#x7bc7;&#x7b14;&#x8bb0;&#xff1a;&#x4f8b;&#x5982; [[&#x53cc;&#x94fe;&#x6e32;&#x67d3;&#x6d4b;&#x8bd5;]]&#x3002;</p><p>&#x4f60;&#x53ef;&#x4ee5;&#x5c06;&#x56fe;&#x7247;&#x6216;&#x8005;&#x97f3;&#x9891;&#x7b49;&#x9644;&#x4ef6;&#x5d4c;&#x5165;&#x5230;&#x4f60;&#x7684;&#x7b14;&#x8bb0;&#x4e2d;&#x3002;&#x5d4c;&#x5165;&#x6587;&#x4ef6;&#x7684;&#x8bed;&#x6cd5;&#x4e3a; <strong>![[&#x6587;&#x4ef6;&#x540d;.png]]</strong></p><p>&#x4f60;&#x53ef;&#x4ee5;&#x901a;&#x8fc7;&#x76f8;&#x540c;&#x7684;&#x8bed;&#x6cd5;&#x5c06; PDF &#x6587;&#x4ef6;&#x5d4c;&#x5165;&#x5230;&#x4f60;&#x7684;&#x7b14;&#x8bb0;&#x4e2d;&#x3002;&#x9664;&#x6b64;&#x4e4b;&#x5916;&#xff0c;&#x4f60;&#x53ef;&#x4ee5;&#x901a;&#x8fc7; <strong>![[My File.pdf#page=number]]</strong> &#x8fd9;&#x6837;&#x7684;&#x5f62;&#x5f0f;&#x76f4;&#x63a5;&#x6307;&#x5b9a;&#x5d4c;&#x5165; PDF &#x6587;&#x4ef6;&#x7684;&#x9875;&#x7801;&#x3002;</p><p>&#x7531;&#x4e8e; Markdown &#x517c;&#x5bb9; HTML&#xff0c;&#x56e0;&#x6b64;&#x4f60;&#x53ef;&#x4ee5;&#x4f7f;&#x7528;&#x201c;iframe&#x201d;&#x5c06;&#x7f51;&#x9875;&#x5d4c;&#x5165;&#x5230;&#x7b14;&#x8bb0;&#x4e2d;&#x3002;</p><blockquote><p>&#x8fd9;&#x4e2a;&#x8bed;&#x6cd5;&#x5b9e;&#x9645;&#x53d7;&#x5230;&#x4e86; Markdown &#x76f8;&#x5173;&#x8bed;&#x6cd5;&#x7684;&#x542f;&#x53d1;&#xff1a;</p><ol><li>&#x5728; Markdown &#x4e2d;&#xff0c;[Image](link.png) &#x53ef;&#x4ee5;&#x8ba9;&#x94fe;&#x63a5;&#x6307;&#x5411;&#x56fe;&#x7247;&#xff0c;&#x800c; ![Image](link.png) &#x80fd;&#x8ba9;&#x56fe;&#x7247;&#x5d4c;&#x5165;&#x5230;&#x5f53;&#x524d;&#x6587;&#x6863;&#x4e2d;&#x3002;</li><li>&#x800c; <a href=\"https://publish.obsidian.md/help-zh/%E4%BD%BF%E7%94%A8%E6%8C%87%E5%8D%97/%E5%86%85%E9%83%A8%E9%93%BE%E6%8E%A5\">&#x5185;&#x90e8;&#x94fe;&#x63a5;</a> &#x7684;&#x8bed;&#x6cd5;&#x5219;&#x57fa;&#x4e8e;&#x4ee5;&#x4e0b;&#x8bbe;&#x5b9a;&#xff1a;[[My page]] &#x662f; [My page](My page) &#x7684;&#x4e00;&#x4e2a;&#x4fbf;&#x6377;&#x5199;&#x6cd5;&#xff08;&#x6216;&#x8005;&#x662f;&#x201c;&#x8bed;&#x6cd5;&#x7cd6;&#x201d;&#xff09;&#x3002;</li></ol><p>&#x7efc;&#x4e0a;&#xff0c;&#x6211;&#x4eec;&#x53ef;&#x4ee5;&#x5f97;&#x5230; ![[My page]] &#x5e94;&#x8be5;&#x7b49;&#x6548;&#x4e8e; ![My page](My page)&#x3002;</p><p>&#x5f53;&#x7136;&#xff0c;&#x6211;&#x4eec;&#x4e5f;&#x53ef;&#x4ee5;&#x4f7f;&#x7528;&#x5176;&#x4ed6;&#x5f62;&#x5f0f;&#x7684;&#x8bed;&#x6cd5;&#x3002;&#x6bd4;&#x5982;&#xff0c;Roam Research &#x7684;&#x5d4c;&#x5165;&#x8bed;&#x6cd5;&#x4e3a; <code>{{embed: ((NODE_ID))}}</code>&#x3002;&#x6211;&#x4eec;&#x66fe;&#x7ecf;&#x60f3;&#x8fc7;&#x4f7f;&#x7528; <code>((Page name))</code> &#x8fd9;&#x6837;&#x7684;&#x5f62;&#x5f0f;&#x6765;&#x8868;&#x793a;&#x5d4c;&#x5165;&#xff0c;&#x4f46;&#x540e;&#x6765;&#x6211;&#x4eec;&#x8ba4;&#x4e3a;&#x8fd8;&#x662f; <strong>![[Page Name]]</strong> &#x7684;&#x5f62;&#x5f0f;&#x80fd;&#x66f4;&#x597d;&#x5730;&#x4e0e;&#x5176;&#x4ed6;&#x8bed;&#x6cd5;&#x4fdd;&#x6301;&#x4e00;&#x81f4;&#xff0c;&#x4fbf;&#x4e8e;&#x8bb0;&#x5fc6;&#xff0c;&#x540c;&#x65f6;&#x4e5f;&#x80fd;&#x51cf;&#x5c11;&#x7b26;&#x53f7;&#x7684;&#x5360;&#x7528;&#xff0c;&#x8ba9;&#x5176;&#x4ed6;&#x7b26;&#x53f7;&#x80fd;&#x591f;&#x8868;&#x793a;&#x5176;&#x4ed6;&#x542b;&#x4e49;&#x3002;</p></blockquote><p>&#x4f60;&#x53ef;&#x4ee5;&#x901a;&#x8fc7;&#x4ee5;&#x4e0b;&#x8bed;&#x6cd5;&#x8c03;&#x6574;&#x5d4c;&#x5165;&#x5230;&#x7b14;&#x8bb0;&#x4e2d;&#x7684;&#x56fe;&#x7247;&#x7684;&#x5927;&#x5c0f;&#xff1a;</p><p>Markdown &#x98ce;&#x683c;&#x7684;&#x5d4c;&#x5165;&#xff0c;&#x4f7f;&#x7528; <strong>![AltText|100x100](<a href=\"https://url/to/image.png/\">https://url/to/image.png\\</a>)</strong> &#x8fd9;&#x6837;&#x7684;&#x8bed;&#x6cd5;&#x3002;</p><p>&#x4e00;&#x822c;&#x7684;&#x5d4c;&#x5165;&#xff0c;&#x4f7f;&#x7528; <strong>![[image.png|100x100]]</strong> &#x8fd9;&#x6837;&#x7684;&#x8bed;&#x6cd5;&#x3002;</p><p>&#x5982;&#x679c;&#x8981;&#x6839;&#x636e;&#x56fe;&#x50cf;&#x7684;&#x5bbd;&#x9ad8;&#x6bd4;&#x4f8b;&#x8fdb;&#x884c;&#x7f29;&#x653e;&#xff0c;&#x8bf7;&#x7701;&#x7565;&#x9ad8;&#x5ea6;&#xff0c;&#x5982; <strong>![[image.png|100]]</strong>&#x3002;</p><p><a href=\"https://publish.obsidian.md/help-zh/%E9%AB%98%E7%BA%A7%E7%94%A8%E6%B3%95/%E4%BD%BF%E7%94%A8+obsidian+URI\">Obsidian URI</a> &#x53ef;&#x4ee5;&#x8ba9;&#x4f60;&#x5728;&#x5176;&#x4ed6;&#x5e94;&#x7528;&#x6216; Obsidian &#x7684;&#x5176;&#x4ed6;&#x5e93;&#x4e2d;&#x6253;&#x5f00;&#x5f53;&#x524d;&#x5e93;&#x7684;&#x67d0;&#x7bc7;&#x7b14;&#x8bb0;&#x3002;</p><p>&#x6bd4;&#x5982;&#xff0c;&#x4f60;&#x53ef;&#x4ee5;&#x901a;&#x8fc7;&#x4ee5;&#x4e0b;&#x65b9;&#x5f0f;&#x8df3;&#x8f6c;&#x5230;&#x67d0;&#x4e2a;&#x5e93;&#x4e2d;&#x7684;&#x67d0;&#x7bc7;&#x7b14;&#x8bb0;&#xff08;&#x8bf7;&#x6ce8;&#x610f; <a href=\"https://publish.obsidian.md/help-zh/%E9%AB%98%E7%BA%A7%E7%94%A8%E6%B3%95/%E4%BD%BF%E7%94%A8+obsidian+URI#%E7%BC%96%E7%A0%81\">URI &#x7684;&#x7f16;&#x7801;</a>&#xff09;&#xff1a;</p><figure class=\"highlight md\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">[<span class=\"string\">&#x6253;&#x5f00;&#x67d0;&#x7bc7;&#x7b14;&#x8bb0;</span>](<span class=\"link\">obsidian://open?path=D:%2Fpath%2Fto%2Ffile.md</span>)</span><br/></pre></td></tr></table></figure><p>&#x5982;&#x679c; url &#x4e2d;&#x542b;&#x6709;&#x7a7a;&#x683c;&#x7684;&#x8bdd;&#xff0c;&#x7a7a;&#x683c;&#x9700;&#x8981;&#x8f6c;&#x4e49;&#x4e3a; <code>%20</code>&#xff0c;&#x5982;&#xff1a;</p><figure class=\"highlight md\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">[<span class=\"string\">Export options</span>](<span class=\"link\">Pasted%20image</span>)</span><br/></pre></td></tr></table></figure><p>&#x793a;&#x4f8b;&#xff1a;<a href=\"Pasted%20image\">Export options</a></p><p>&#x5f53;&#x7136;&#xff0c;&#x4f60;&#x4e5f;&#x53ef;&#x4ee5;&#x7528; <code>&lt;&gt;</code> &#x5c06;&#x7a7a;&#x683c;&#x5305;&#x542b;&#x8d77;&#x6765;&#xff0c;&#x5982;&#xff1a;</p><figure class=\"highlight md\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">[<span class=\"string\">Slides Demo</span>](<span class=\"link\">&lt;Slides Demo&gt;</span>)</span><br/></pre></td></tr></table></figure><p>&#x793a;&#x4f8b;&#xff1a;<a href=\"Slides%20Demo\">Slides Demo</a></p><h2 id=\"Comments-&#x6ce8;&#x91ca;\"><a href=\"#Comments-&#x6ce8;&#x91ca;\" class=\"headerlink\" title=\"Comments &#x6ce8;&#x91ca;\"/>Comments &#x6ce8;&#x91ca;</h2><p>&#x6240;&#x8c13;&#x6ce8;&#x91ca;&#xff0c;&#x6307;&#x7684;&#x662f;&#x4f1a;&#x5728;&#x7f16;&#x8f91;&#x6a21;&#x5f0f;&#x4e2d;&#x663e;&#x793a;&#xff0c;&#x4f46;&#x4e0d;&#x4f1a;&#x5728;&#x9884;&#x89c8;&#x6a21;&#x5f0f;&#x4e2d;&#x663e;&#x793a;&#x7684;&#x5185;&#x5bb9;&#x3002;&#x4f7f;&#x7528; <code>%%</code> &#x53ef;&#x4ee5;&#x5c06;&#x5185;&#x5bb9;&#x53d8;&#x4e3a;&#x6ce8;&#x91ca;&#x3002;&#x4ee5;&#x4e0b;&#x4e3a;&#x8bed;&#x6cd5;&#xff1a;</p><figure class=\"highlight md\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/><span class=\"line\">3</span><br/><span class=\"line\">4</span><br/><span class=\"line\">5</span><br/><span class=\"line\">6</span><br/><span class=\"line\">7</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">&#x8fd9;&#x91cc;&#x662f;&#x884c;&#x5185;&#x6ce8;&#x91ca;&#xff1a;%%&#x9884;&#x89c8;&#x6a21;&#x5f0f;&#x4e0b;&#x4f60;&#x5c06;&#x770b;&#x4e0d;&#x5230;&#x8fd9;&#x53e5;&#x8bdd;%%</span><br/><span class=\"line\"/><br/><span class=\"line\">&#x8fd9;&#x91cc;&#x662f;&#x8de8;&#x884c;&#x6ce8;&#x91ca;&#xff1a;</span><br/><span class=\"line\">%%</span><br/><span class=\"line\">&#x6240;&#x8c13;&#x8de8;&#x884c;</span><br/><span class=\"line\">&#x5c31;&#x662f;&#x53ef;&#x4ee5;&#x6709;&#x5f88;&#x591a;&#x884c;</span><br/><span class=\"line\">%%</span><br/></pre></td></tr></table></figure><p>&#x4ee5;&#x4e0b;&#x4e3a;&#x793a;&#x4f8b;&#xff1a;</p><p>&#x8fd9;&#x91cc;&#x662f;&#x884c;&#x5185;&#x6ce8;&#x91ca;&#xff1a;%% &#x9884;&#x89c8;&#x6a21;&#x5f0f;&#x4e0b;&#x4f60;&#x5c06;&#x770b;&#x4e0d;&#x5230;&#x8fd9;&#x53e5;&#x8bdd;%%</p><p>&#x8fd9;&#x91cc;&#x662f;&#x8de8;&#x884c;&#x6ce8;&#x91ca;&#xff1a;</p><p>%%<br/>&#x6240;&#x8c13;&#x8de8;&#x884c;<br/>&#x5c31;&#x662f;&#x53ef;&#x4ee5;&#x6709;&#x5f88;&#x591a;&#x884c;<br/>%%</p><h2 id=\"&#x6807;&#x6ce8;-Callouts\"><a href=\"#&#x6807;&#x6ce8;-Callouts\" class=\"headerlink\" title=\"&#x6807;&#x6ce8; Callouts\"/>&#x6807;&#x6ce8; Callouts</h2><p>&#x53c2;&#x8003;&#xff1a;<a href=\"https://help.obsidian.md/