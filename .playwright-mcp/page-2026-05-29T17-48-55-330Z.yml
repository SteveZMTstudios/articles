f0c;&#x6240;&#x4ee5;&#x4e00;&#x822c;&#x4e0d;&#x4f1a;&#x662f;&#x7f51;&#x7edc;&#x653b;&#x51fb;&#x6216;&#x8005;&#x505c;&#x7535;&#x5bfc;&#x81f4;&#x7684;</p><p>&#x6574;&#x4e2a;&#x670d;&#x52a1;&#x8fc7;&#x7a0b;&#x662f;&#x4e00;&#x4f1a;&#x513f;ok&#xff0c;&#x4e00;&#x4f1a;&#x513f;&#x4e0d;&#x884c;&#x7684;&#xff0c;&#x57fa;&#x672c;&#x4e0a;&#x5904;&#x4e8e;&#x4e00;&#x4e2a;&#x4ef0;&#x5367;&#x8d77;&#x5750;&#x72b6;&#x6001;&#x3002;</p><hr/><p>&#x8bf4;&#x51e0;&#x4ef6;&#x6709;&#x610f;&#x601d;&#x7684;&#x4e8b;</p><ol><li>&#x77e5;&#x540d;&#x4e92;&#x8054;&#x7f51;&#x68c0;&#x6d4b;&#x670d;&#x52a1; downdetector.com &#x56e0;&#x4e3a;&#x5176;&#x4f7f;&#x7528;&#x4e86;cloudflare&#x4fdd;&#x62a4;&#x6e90;&#x7ad9;&#x5bfc;&#x81f4;&#x5728;&#x5168;&#x7403;&#x7f51;&#x7edc;&#x670d;&#x52a1;&#x5d29;&#x6e83;&#x7684;&#x65f6;&#x5019;&#x4ed6;&#x4eec;&#x4e5f;&#x5d29;&#x6e83;&#x4e86;.</li><li><img src=\"/images/blog/cloudflare-down/downdetector_compressed.jpg\" alt=\"well this is awkward\" title=\"downdetector &#x4f7f;&#x7528; cloudflare &#x4fdd;&#x62a4;&#x6e90;&#x7ad9;&#xff0c;&#x7ed3;&#x679c;&#x81ea;&#x5df1;&#x4e5f;&#x6302;&#x4e86;\"/></li><li>Chatgpt.com &#x4e5f;&#x4f7f;&#x7528; cloudflare &#x6765;&#x4fdd;&#x62a4;&#x6e90;&#x7ad9;&#xff0c;&#x6240;&#x4ee5;&#x53ef;&#x80fd; cloudflare &#x5de5;&#x7a0b;&#x5e08;&#x4e5f;&#x4e0a;&#x4e0d;&#x4e86; chatgpt.com &#x6765;&#x95ee;AI&#x89e3;&#x51b3;&#x95ee;&#x9898;</li></ol><p>&#x76ee;&#x524d;&#x5ba2;&#x670d;&#x544a;&#x77e5;&#x6280;&#x672f;&#x5de5;&#x7a0b;&#x5e08;&#x6e05;&#x9664;&#x7f13;&#x5b58;&#x540e;&#x518d;&#x6b21;&#x7206;&#x70b8;&#xff0c;CF&#x4f01;&#x4e1a;&#x8d54;&#x4ed8;&#x91d1;&#x989d;&#x8fd8;&#x5728;&#x589e;&#x52a0;</p><p>&#x672c;&#x6b21;&#x6309;&#x7167;&#x5408;&#x540c;&#xff0c;&#x5c5e;&#x4e8e;&#x91cd;&#x5927;&#x57fa;&#x7840;&#x8bbe;&#x65bd;&#x5d29;&#x6e83;&#xff0c;&#x5bfc;&#x81f4;&#x5ba2;&#x6237;&#x7f51;&#x7edc;&#x5b8c;&#x5168;&#x4e0d;&#x53ef;&#x7528;&#xff0c;&#x636e;&#x8bf4;&#x5f97;&#x6309;&#x79d2;&#x8d54;&#x4ed8;</p><hr/><blockquote><p>Monitoring - A fix has been implemented and we believe the incident is now resolved. We are continuing to monitor for errors to ensure all services are back to normal.<br/>Nov 18, 2025 - 14:42 UTC</p></blockquote><p>cloudflare&#x5b98;&#x65b9;&#x5df2;&#x7ecf;&#x5ba3;&#x5e03;&#x6545;&#x969c;&#x5df2;&#x4fee;&#x590d;&#xff0c;&#x6b63;&#x5728;&#x76d1;&#x63a7;&#x4e2d;&#x3002;<br/>&#x4f46;&#x662f;cf&#x7684;NFT&#x5df2;&#x7ecf;&#x66b4;&#x8dcc;&#x4e86;&#xff0c;&#x4e0d;&#x77e5;&#x9053;&#x660e;&#x5929;&#x5f00;&#x5e02;&#x600e;&#x4e48;&#x6837;&#x3002;&#x6bd5;&#x7adf;CDN&#x670d;&#x52a1;&#x5546;&#x7ef4;&#x62a4;&#x80fd;&#x628a;&#x670d;&#x52a1;&#x7ef4;&#x62a4;&#x70b8;&#xff0c;&#x7a33;&#x5b9a;&#x6027;&#x5927;&#x5e45;&#x4e0b;&#x8dcc;&#x3002;</p><p><img src=\"/images/blog/cloudflare-down/thumbnail_compressed.jpg\"/></p><details><summary>Cloudflare &#x65e5;&#x5fd7;</summary><p>Cloudflare Global Network experiencing issues</p><p>Update - The team is continuing to focus on restoring service post-fix. We are mitigating several issues that remain post-deployment.<br/>Nov 18, 2025 - 15:40 UTC<br/>Update - We are continuing to monitor for any further issues.<br/>Nov 18, 2025 - 15:23 UTC<br/>Update - Some customers may be still experiencing issues logging into or using the Cloudflare dashboard. We are working on a fix to resolve this, and continuing to monitor for any further issues.<br/>Nov 18, 2025 - 14:57 UTC<br/>Monitoring - A fix has been implemented and we believe the incident is now resolved. We are continuing to monitor for errors to ensure all services are back to normal.<br/>Nov 18, 2025 - 14:42 UTC<br/>Update - We&#x2019;ve deployed a change which has restored dashboard services. We are still working to remediate broad application services impact<br/>Nov 18, 2025 - 14:34 UTC<br/>Update - We are continuing to work on a fix for this issue.<br/>Nov 18, 2025 - 14:22 UTC<br/>Update - We are continuing working on restoring service for application services customers.<br/>Nov 18, 2025 - 13:58 UTC<br/>Update - We are continuing working on restoring service for application services customers.<br/>Nov 18, 2025 - 13:35 UTC<br/>Update - We have made changes that have allowed Cloudflare Access and WARP to recover. Error levels for Access and WARP users have returned to pre-incident rates.<br/>We have re-enabled WARP access in London.</p><p>We are continuing to work towards restoring other services.<br/>Nov 18, 2025 - 13:13 UTC<br/>Identified - The issue has been identified and a fix is being implemented.<br/>Nov 18, 2025 - 13:09 UTC<br/>Update - During our attempts to remediate, we have disabled WARP access in London. Users in London trying to access the Internet via WARP will see a failure to connect.<br/>Nov 18, 2025 - 13:04 UTC<br/>Update - We are continuing to investigate this issue.<br/>Nov 18, 2025 - 12:53 UTC<br/>Update - We are continuing to investigate this issue.<br/>Nov 18, 2025 - 12:37 UTC<br/>Update - We are seeing services recover, but customers may continue to observe higher-than-normal error rates as we continue remediation efforts.<br/>Nov 18, 2025 - 12:21 UTC<br/>Update - We are continuing to investigate this issue.<br/>Nov 18, 2025 - 12:03 UTC<br/>Investigating - Cloudflare is experiencing an internal service degradation. Some services may be intermittently impacted. We are focused on restoring service. We will update as we are able to remediate. More updates to follow shortly.<br/>Nov 18, 2025 - 11:48 UTC</p></details></div></browser:html> </entry> <entry> <author> <name>Steve ZMT</name> </author> <category term=\"鎶樿吘\" scheme=\"https://blog.stevezmt.top/categories/%E6%8A%98%E8%85%BE/\"/> <category term=\"iVentoy\" scheme=\"https://blog.stevezmt.top/tags/iVentoy/\"/> <category term=\"PXE\" scheme=\"https://blog.stevezmt.top/tags/PXE/\"/> <category term=\"缃戠粶寮曞\" scheme=\"https://blog.stevezmt.top/tags/%E7%BD%91%E7%BB%9C%E5%BC%95%E5%AF%BC/\"/> <content> <![CDATA[<p>杩戞湡瑕佺粰瀹堕噷鍙︿竴鍙扮數鑴戦噸鍋氱郴缁燂紝浣嗘槸鎵嬭竟娌℃湁U鐩橈紝灏辨兂鐫€鎶樿吘缃戠粶鍚姩鐪嬬湅鍏峌鐩樿兘涓嶈兘瑁呯郴缁熴€�</p><span id=\"more\"></span><p>浠ュ墠涓轰簡鍋氬鏍＄數鑴戞壒閲忚嚜鍔ㄦ仮澶嶅仛 HephaestusOS 鐨勬椂鍊欏氨鐢ㄨ繃PXE锛屽彧涓嶈繃椤圭洰鍚庨潰闅句骇浜嗭紝瀵艰嚧鏈€鍚庝篃娌″交搴曞疄鐜般€�<br>PXE 鐨勫師鐞嗗叾瀹炲緢绠€鍗曪紝灏辨槸閫氳繃DHCP鍜孴FTP鍗忚璁╃數鑴戜粠缃戠粶涓婁笅杞藉惎鍔ㄦ枃浠讹紝鐒跺悗鍐嶅姞杞芥搷浣滅郴缁熴€�<br>鍥犳瀵瑰甫瀹界殑瑕佹眰姣旇緝楂橈紝濡傛灉璺戜笉鍒板崈鍏嗙殑璇濇晥鏋滃彲鑳戒笉濡俇鐩樸€�<br>锛堜絾鏄垜蹇樻€уぇ锛孶鐩橀兘涓㈠厜浜嗗鑷存垜涓€鏃跺崐浼氭墜杈圭湡鎵句笉鍒拌兘鏍肩殑U鐩樷€︼級</p><h2 id=\"iVentoy\"><a href=\"#iVentoy\" class=\"headerlink\" title=\"iVentoy\"></a>iVentoy</h2><p>iVentoy 鏈川涓婃槸涓� PXE 鏈嶅姟鍣紝鍙互鍦╓indows鍜孡inux涓婂弻鍑昏繍琛岋紝涓嶉渶瑕佸お澶氶厤缃紝寮€绠卞嵆鐢ㄣ€�</p><p>闇€瑕佹敞鎰忕殑鏄痠Ventoy涓嶆槸鑷敱杞欢锛岃櫧鐒朵釜浜哄彲浠ュ厤璐逛娇鐢紝浣嗘槸鏈夎澶囬檺鍒讹紝涔熶笉鏀寔ARM鏋舵瀯鐨勮澶囷紝瑕佹斁瀹介檺鍒堕渶瑕佽喘涔版巿鏉冩縺娲汇€�</p><p>涓嶈繃瀵逛簬瀹剁敤鐢佃剳鍜屾櫘閫氱數鑴戠淮淇簵鏉ヨ锛屽厤璐圭増宸茬粡瓒冲浣跨敤浜嗐€�</p><p>iVentoy 椤圭洰鍦板潃锛�<a href=\"https://www.iventoy.com/cn/index.html\">https://www.iventoy.com/cn/index.html</a></p><h2 id=\"PXE\"><a href=\"#PXE\" class=\"headerlink\" title=\"PXE\"></a>PXE</h2><p>PXE 鐨勫師鐞嗗叾瀹炲緢绠€鍗曪紝灏辨槸閫氳繃DHCP鍜孴FTP鍗忚璁╃數鑴戜粠缃戠粶涓婁笅杞藉惎鍔ㄦ枃浠讹紝鐒跺悗鍐嶅姞杞姐€�<br>鐒跺悗铔嬬柤鐨勫湴鏂瑰氨鏉ヤ簡锛屽鐢ㄨ矾鐢卞櫒濡傛灉涓嶅埛鏈虹殑璇濓紝鍩烘湰涓婇兘涓嶆敮鎸丳XE寮曞銆�<br>骞稿ソ鐜板湪鐨勮矾鐢卞櫒澶у鏀寔瀹夎绗笁鏂瑰浐浠讹紝姣斿 OpenWrt銆丳adavan銆佹鏋楃瓑銆�</p><p>鎮插偓鐨勬槸鎴戝閫夋嫨浜嗕腑鍏寸殑璺敱鍣紝鏍规湰娌″緱鍒枫€�</p><p>鐒跺悗缁х画鎵炬暀绋嬧€�</p><h2 id=\"璺敱鍣ㄩ厤缃�\"><a href=\"#璺敱鍣ㄩ厤缃�\" class=\"headerlink\" title=\"璺敱鍣ㄩ厤缃�\"></a>璺敱鍣ㄩ厤缃�</h2><p>棣栧厛鎶奿Ventoy璁剧疆涓篍xternal DHCP妯″紡锛岀劧鍚庤缃ソTFTP鏍圭洰褰曪紝鏀惧叆闇€瑕佺殑ISO鏂囦欢銆�<br>濡傛灉璺敱鍣ㄨ兘鍒锋満鐨勮瘽锛屾帹鑽愬埛 OpenWrt锛岀劧鍚庡畨瑁� <code>dnsmasq</code> 鍜� <code>tftpd</code> 涓や釜杞欢鍖咃紝灏卞彲浠ラ厤缃甈XE浜嗭紝杩樻槸寰堢畝鍗曠殑銆�<br><del>锛堜綘濡堝鐨勭綉涓婃竻涓€鑹茬殑鏁欑▼閮芥槸杩欎釜鈥︼級</del></p><h2 id=\"鐩存帴iPXE鎸囧畾缃戠粶璁惧\"><a href=\"#鐩存帴iPXE鎸囧畾缃戠粶璁惧\" class=\"headerlink\" title=\"鐩存帴iPXE鎸囧畾缃戠粶璁惧\"></a>鐩存帴iPXE鎸囧畾缃戠粶璁惧</h2><p>鎴戞兂鐫€鏄紝鍙嶆閮芥槸DHCP鍜孴FTP鍗忚锛岃兘涓嶈兘鐩存帴鎸囧畾IP鍦板潃鍜孴FTP鏈嶅姟鍣ㄥ湴鍧€锛岀劧鍚庣洿鎺ヨ繛鎺ュ埌iVentoy鐨凾FTP鏈嶅姟鍣ㄤ笂锛岀渷鐨勬姌鑵捐矾鐢卞櫒锛�<br>缁х画鏌ヤ簡鍑犲崄鏉℃暀绋嬶紝鍙戠幇 iPXE 鏀寔鐩存帴鎸囧畾缃戠粶璁惧鍜孴FTP鏈嶅姟鍣ㄥ湴鍧€銆�<br>浣嗘槸锛�<br>瀹屾垚DHCP鍚庯紝<br>ipxe 鎵撲笉寮€锛岃繛涓嶄笂銆�<br>浣犲銆�</p><h2 id=\"鐢�-EFI-shell-杩�\"><a href=\"#鐢�-EFI-shell-杩�\" class=\"headerlink\" title=\"鐢� EFI shell 杩�\"></a>鐢� EFI shell 杩�</h2><p>涓囪埇鏃犲鍘绘眰鍔〥eepseek锛岀劧鍚巇eepseek涔熻窡涓嫢鍙竴鏍风厼鏈変粙浜嬪湴璁茶EFI shell鍙互杩炪€�<br>鐪熷凹鐜涙壇娣★紝EFI shell鍙兘鎸囧畾鏈湴鏂囦欢锛岃繛涓猅FTP閮戒笉鏀寔銆�<br>缁х画闂紝deepseek鍙堥鎵贰璇村彲浠ョ敤<code>ifconfig</code>鍜�<code>tftp</code>鍛戒护銆�<br>璁茬潃璁茬潃杩�<code>wget</code>閮借兘璁插嚭鏉ヤ簡銆�<br>G<em>t</em>ub Cop**ot涔熸病濂藉埌鍝噷鍘汇€�<br>鎴戠湡鏄湇浜嗐€�</p><h2 id=\"鏈€缁堣В鍐虫柟妗堬細鍏虫帀璺敱鍣―HCP\"><a href=\"#鏈€缁堣В鍐虫柟妗堬細鍏虫帀璺敱鍣―HCP\" class=\"headerlink\" title=\"鏈€缁堣В鍐虫柟妗堬細鍏虫帀璺敱鍣―HCP\"></a>鏈€缁堣В鍐虫柟妗堬細鍏虫帀璺敱鍣―HCP</h2><p>鏈€鍚庣獊鐒舵兂鍒帮紝iVentoy鐨凞HCP閫夐」閲岃繕鏈変竴涓彨Internal鐨勯€夐」銆�<br>鏌ラ槄鏂囨。鍙戠幇杩欎釜閫夐」鏄iVentoy鑷繁鍏呭綋DHCP鏈嶅姟鍣ㄣ€�<br>鐒跺悗鎴戝氨鎶婅矾鐢卞櫒鐨凞HCP鍏虫帀浜嗭紝鐩存帴璁﹊Ventoy鍏呭綋DHCP鏈嶅姟鍣ㄣ€�<br>鐒跺悗灏辨垚鍔熶簡銆�</p><p>濡傛灉鏈夊叾浠栬仈缃戣澶囧湪绾垮苟涓旇涓婄綉鐨勮瘽锛岃寰楁寚瀹氫竴涓婦NS銆�</p><p>涓轰粈涔堣繖涔堢畝鍗曠殑涓滆タ娌′汉鍐欐暀绋嬪憿锛�</p>]]> </content> <id>https://blog.stevezmt.top/2025/09/29/iventoy-pxe-in-home/</id> <link href=\"https://blog.stevezmt.top/2025/09/29/iventoy-pxe-in-home/\"/> <published>2025-09-29T13:31:33.000Z</published> <summary> <![CDATA[<p>杩戞湡瑕佺粰瀹堕噷鍙︿竴鍙扮數鑴戦噸鍋氱郴缁燂紝浣嗘槸鎵嬭竟娌℃湁U鐩橈紝灏辨兂鐫€鎶樿吘缃戠粶鍚姩鐪嬬湅鍏峌鐩樿兘涓嶈兘瑁呯郴缁熴€�</p>]]> </summary> <title>iVentoy 涓庡鐢ㄨ矾鐢卞櫒寮曞 PXE</title> <updated>2025-11-19T03:48:30.673Z</updated> <browser:html type=\"xhtml\"><div xmlns=\"http://www.w3.org/1999/xhtml\"><p>&#x8fd1;&#x671f;&#x8981;&#x7ed9;&#x5bb6;&#x91cc;&#x53e6;&#x4e00;&#x53f0;&#x7535;&#x8111;&#x91cd;&#x505a;&#x7cfb;&#x7edf;&#xff0c;&#x4f46;&#x662f;&#x624b;&#x8fb9;&#x6ca1;&#x6709;U&#x76d8;&#xff0c;&#x5c31;&#x60f3;&#x7740;&#x6298;&#x817e;&#x7f51;&#x7edc;&#x542f;&#x52a8;&#x770b;&#x770b;&#x514d;U&#x76d8;&#x80fd;&#x4e0d;&#x80fd;&#x88c5;&#x7cfb;&#x7edf;&#x3002;</p><span id=\"more\"/><p>&#x4ee5;&#x524d;&#x4e3a;&#x4e86;&#x505a;&#x5b66;&#x6821;&#x7535;&#x8111;&#x6279;&#x91cf;&#x81ea;&#x52a8;&#x6062;&#x590d;&#x505a; HephaestusOS &#x7684;&#x65f6;&#x5019;&#x5c31;&#x7528;&#x8fc7;PXE&#xff0c;&#x53ea;&#x4e0d;&#x8fc7;&#x9879;&#x76ee;&#x540e;&#x9762;&#x96be;&#x4ea7;&#x4e86;&#xff0c;&#x5bfc;&#x81f4;&#x6700;&#x540e;&#x4e5f;&#x6ca1;&#x5f7b;&#x5e95;&#x5b9e;&#x73b0;&#x3002;<br/>PXE &#x7684;&#x539f;&#x7406;&#x5176;&#x5b9e;&#x5f88;&#x7b80;&#x5355;&#xff0c;&#x5c31;&#x662f;&#x901a;&#x8fc7;DHCP&#x548c;TFTP&#x534f;&#x8bae;&#x8ba9;&#x7535;&#x8111;&#x4ece;&#x7f51;&#x7edc;&#x4e0a;&#x4e0b;&#x8f7d;&#x542f;&#x52