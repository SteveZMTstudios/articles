</browser:html> </entry> <entry> <author> <name>Steve ZMT</name> </author> <category term=\"鐬庢悶\" scheme=\"https://blog.stevezmt.top/categories/%E7%9E%8E%E6%90%9E/\"/> <category term=\"寮€婧�\" scheme=\"https://blog.stevezmt.top/tags/%E5%BC%80%E6%BA%90/\"/> <category term=\"linux\" scheme=\"https://blog.stevezmt.top/tags/linux/\"/> <category term=\"wsl\" scheme=\"https://blog.stevezmt.top/tags/wsl/\"/> <category term=\"yubikey\" scheme=\"https://blog.stevezmt.top/tags/yubikey/\"/> <category term=\"usb\" scheme=\"https://blog.stevezmt.top/tags/usb/\"/> <content> <![CDATA[<p>鏈夋椂缁忓父闇€瑕佸湪WSL2涓墽琛屼竴浜汫PG鎿嶄綔锛屾瘮濡傜鍚岹it鎻愪氦浠€涔堢殑銆傚鏋滄鏃跺張涓嶅垢璐拱浜哬ubikey锛岄偅涔堝氨闇€瑕佹兂鍔炴硶璁〨PG鍜屾彃鍦╓indows涓婄殑Yubikey瀵逛笂璇濄€�</p><p>鐒惰€屽鏋滀綘瑕佷竴鏃︿笂缃戝幓鎼滅储<code>wsl gpg yubikey</code>锛岄偅涔堜綘澶ф灏变細鐪嬪埌鍍�<a href=\"https://readmedium.com/how-to-use-a-yubikey-in-wsl2-linux-on-windows-96f176518583\">杩欐牱</a>鎴栬€�<a href=\"https://blog.caomingjun.com/series/yubikey/wsl/\">閭ｆ牱</a>鐨勬枃绔犮€�</p><p>璇氱劧锛岃繖浜涙枃绔犲啓鐨勯兘寰堝ソ銆傛垜鑷繁浠ュ墠涔熸槸鐢╱sbipd鎶妝ubikey鏄犲皠鍒皐sl涓€備絾杩欐牱鏈変釜闂锛屼綘浼氬繕璁颁笂涓€娆￠厤缃畊sbipd鎶妝ubikey鎺ュ埌linux涓婁簡锛岃繖寰堝鏄撳鑷存湭棰勬湡鐨勯敊璇€�</p><p>濡傛灉浣犻€夋嫨鍘婚棶AI锛岄偅涔堝畠澶ф浼氱粰浣犱竴涓骞荤殑绛旀锛岃浣犲湪windows鍜宭inux涓婅涓€澶у爢涔变竷鍏碂鐨勪笢瑗匡紝鐒跺悗鏈€濂界殑鎯呭喌鏄�<code>gpg --card-status</code>娌℃湁鍙嶅簲銆�</p><p>浣嗘槸锛學SL锛圵indows Subsystem of Linux锛夊繀椤诲緱Sub鉁嶏笍鉁嶏笍鉁嶏笍锛屽氨鍍忓畠鐨勫悕瀛椾竴鏍�</p><p>濂戒簡涓嶆壇搴熻瘽浜嗭紝鎴戞潵璇存垜鐜板湪鐨勮В鍐虫柟妗堛€�</p><h2 id=\"鎴戠殑鐜\"><a href=\"#鎴戠殑鐜\" class=\"headerlink\" title=\"鎴戠殑鐜\"></a>鎴戠殑鐜</h2><p>杩欐槸鎴戠殑fastfetch锛屽嵆浣夸笉瀹屽叏鍖归厤搴旇涔熸病澶ч棶棰�</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br><span class=\"line\">3</span><br><span class=\"line\">4</span><br><span class=\"line\">5</span><br><span class=\"line\">6</span><br><span class=\"line\">7</span><br><span class=\"line\">8</span><br><span class=\"line\">9</span><br></pre></td><td class=\"code\"><pre><span class=\"line\"><span class=\"built_in\">PS</span> C:\\Users\\stevezmt&gt; uname <span class=\"literal\">-a</span></span><br><span class=\"line\">uname: The term <span class=\"string\">&#x27;uname&#x27;</span> is not recognized as a name of a cmdlet, function, script file, or executable program.</span><br><span class=\"line\">Check the spelling of the name, or <span class=\"keyword\">if</span> a path was included, verify that the path is correct and <span class=\"keyword\">try</span> again.</span><br><span class=\"line\"><span class=\"built_in\">PS</span> C:\\Users\\stevezmt&gt; fastfetch <span class=\"literal\">-l</span> none</span><br><span class=\"line\">stevezmt@DESKTOP<span class=\"literal\">-LLICT9J</span></span><br><span class=\"line\"><span class=\"literal\">------------------------</span></span><br><span class=\"line\">OS: Windows <span class=\"number\">11</span> 涓撲笟鐗� Insider Preview (<span class=\"number\">25</span>H2) x86_64</span><br><span class=\"line\">Host: Yilong15Pro Series GM5HG0A</span><br><span class=\"line\">Kernel: WIN32_NT <span class=\"number\">10.0</span>.<span class=\"number\">26220.8165</span></span><br></pre></td></tr></table></figure><p>鎴戠殑WSL锛�</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br><span class=\"line\">3</span><br><span class=\"line\">4</span><br><span class=\"line\">5</span><br><span class=\"line\">6</span><br><span class=\"line\">7</span><br><span class=\"line\">8</span><br><span class=\"line\">9</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">steve@DESKTOP-LLICT9J:~$ <span class=\"built_in\">uname</span> -a</span><br><span class=\"line\">Linux DESKTOP-LLICT9J 6.6.87.2-microsoft-standard-WSL2 <span class=\"comment\">#1 SMP PREEMPT_DYNAMIC Thu Jun 5 18:30:46 UTC 2025 x86_64 x86_64 x86_64 GNU/Linux</span></span><br><span class=\"line\">steve@DESKTOP-LLICT9J:~$ <span class=\"built_in\">cat</span> /etc/lsb-release</span><br><span class=\"line\">DISTRIB_ID=Ubuntu</span><br><span class=\"line\">DISTRIB_RELEASE=24.04</span><br><span class=\"line\">DISTRIB_CODENAME=noble</span><br><span class=\"line\">DISTRIB_DESCRIPTION=<span class=\"string\">&quot;Ubuntu 24.04.4 LTS&quot;</span></span><br><span class=\"line\">steve@DESKTOP-LLICT9J:~$</span><br><span class=\"line\"></span><br></pre></td></tr></table></figure><p>鎴戠殑鐢佃剳涓婂畨瑁呬簡<a href=\"https://www.gpg4win.org/\">Gpg4win</a>锛屾垜瑙夊緱浣犱滑涔熼兘搴旇瑁呬竴涓�</p><h2 id=\"鎴戠幇鍦ㄧ殑瑙ｅ喅鏂规\"><a href=\"#鎴戠幇鍦ㄧ殑瑙ｅ喅鏂规\" class=\"headerlink\" title=\"鎴戠幇鍦ㄧ殑瑙ｅ喅鏂规\"></a>鎴戠幇鍦ㄧ殑瑙ｅ喅鏂规</h2><p>灏卞儚鎴戞枃绔犲ご鍥鹃偅鏍凤細</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">gpg.exe</span><br></pre></td></tr></table></figure><p>鐪熺殑锛屽鏋滄兂鍦╳sl涓婁笅鏂囬噷闈㈣繍琛屼换浣晈indows绋嬪簭鐨勮瘽锛屽悗闈㈠姞涓�<code>.exe</code>灏卞ソ浜嗐€�</p><p>浣犵敋鑷冲彲浠ョ洿鎺ュ湪 WSL2 缁堢閲岃緭鍏� <code>notepad.exe</code> 骞跺洖杞︼紝Windows 璁颁簨鏈氨浼氬脊鍑烘潵</p><p>涔熷氨鏄锛屽鏋滀綘鎯宠鍦╳sl閲岄潰鐢╣pg绛剧讲鎻愪氦锛屽苟涓攚indows鐨刧pg4win涔熼兘閰嶇疆瀹屾垚浜嗭紝閭ｄ綘灏卞彲浠ョ洿鎺ワ細</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">git config --global gpg.program gpg.exe</span><br></pre></td></tr></table></figure><p><img src=\"/images/blog/wsl-gpg.exe/img_1776093416571_0_compressed.jpg\"></p><p>褰撶劧绫讳技<code>cls</code> <code>dir</code>杩欑cmd.exe鎻愪緵鐨勫懡浠や笉澶ц窇鐨勮捣鏉ワ紝涓嶈繃<code>shutdown.exe</code>鏄彲浠ョ殑</p><p>鍚岀悊锛屼綘鐢氳嚦鍙互<code>alias adb=&quot;adb.exe&quot;</code>锛岀劧鍚巜sl鍜寃indows璋冭瘯鍚屼竴鍙拌澶�</p><p><img src=\"/images/blog/wsl-gpg.exe/img_1776093550944_0_compressed.jpg\"></p><p>濡傛灉浣犵殑宸ヤ綔鍙槸瑕佷紶閫�<code>stdin</code>鍜�<code>stdout</code>灏卞彲浠ヤ簡鐨勮瘽锛岀敤杩欎釜灏卞浜嗐€�</p><h3 id=\"涓轰綍瀹冭繍浣滐紵\"><a href=\"#涓轰綍瀹冭繍浣滐紵\" class=\"headerlink\" title=\"涓轰綍瀹冭繍浣滐紵\"></a>涓轰綍瀹冭繍浣滐紵</h3><p>鎴戣寰梬sl鍜屾櫘閫氳櫄鎷熸満鐩告瘮鏈€澶т紭鍔夸笉鏄畠蹇紝涔熶笉鏄祫婧愮鐞嗗櫒鐩存帴绠＄悊铏氭嫙纾佺洏锛岃€屾槸<strong>璺ㄦ搷浣滅郴缁熻繘绋嬫搷浣�</strong>锛圕ross-OS Process Interop锛�</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br><span class=\"line\">2</span><br><span class=\"line\">3</span><br><span class=\"line\">4</span><br><span class=\"line\">5</span><br><span class=\"line\">6</span><br><span class=\"line\">7</span><br><span class=\"line\">8</span><br></pre></td><td class=\"code\"><pre><span class=\"line\"></span><br><span class=\"line\">steve@DESKTOP-LLICT9J:~$ <span class=\"built_in\">cat</span> /proc/sys/fs/binfmt_misc/WSLInterop</span><br><span class=\"line\">enabled</span><br><span class=\"line\">interpreter /init</span><br><span class=\"line\">flags: P</span><br><span class=\"line\">offset 0</span><br><span class=\"line\">magic 4d5a</span><br><span class=\"line\"></span><br></pre></td></tr></table></figure><p>鍙互鐪嬪埌锛屽畠灏嗘墍鏈変互<code>4d5a</code>寮€澶寸殑鏂囦欢浜ょ粰浜�<code>/init</code>鍘诲鐞嗐€�</p><p>閭ｄ负浠€涔堟槸&#x2F;init锛�</p><p>&#x2F;init鍏呭綋Linux铏氭嫙鏈轰笌Windows涓绘満闂寸殑鈥滆法绯荤粺娑堟伅鎬荤嚎鈥濄€傚畠浼氭鏌ヨ嚜宸辫璋冪敤鏃剁殑鈥滃悕瀛椻€濓紙argv[0]锛夛紝鏉ョ煡閬撳畠鐜板湪璇ュ共鍢涖€傚湪杩欐璋冪敤涓紝瀹冪殑鍚嶅瓧鏄�&#x2F;init锛屼簬鏄氨寮€濮嬩綔涓篵infmt_misc鐨勮В閲婂櫒锛屽皾璇曞惎鍔ㄤ竴涓獁indows绋嬪簭銆�</p><p>杩欏氨鏄负浣晈sl鍐呮牳瑕佸畾鍒躲€�</p><p>鍚姩鏂扮殑 Windows 杩涚▼<code>/init</code>闇€瑕佽繛鎺ュ埌浜掓搷浣滄湇鍔″櫒銆備簰鎿嶄綔鏈嶅姟鍣ㄦ槸鐗规畩鐨� Linux 杩涚▼锛屽厖褰� Linux 鍜� Windows 涔嬮棿鐨勬ˉ姊併€傚畠浠笌 Windows 杩涚▼锛堜緥濡�<code>wsl.exe</code>鎴�<code>wslhost.exe</code>锛変繚鎸佸畨鍏ㄧ殑閫氫俊閫氶亾锛堥€氳繃 hvsocket 杩炴帴锛夛紝浠庤€屽惎鍔� Windows 鍙墽琛屾枃浠躲€�</p><p>鍦� Linux 绯荤粺涓紝姣忎釜浼氳瘽棰嗗鑰呭拰姣忎釜init瀹炰緥閮芥湁涓€涓叧鑱旂殑浜掓搷浣滄湇鍔″櫒锛岃鏈嶅姟鍣ㄩ€氳繃 unix 濂楁帴瀛楁彁渚涙湇鍔�<code>/run/WSL</code>銆�</p><p><code>/init</code>浣跨敤<code>$WSL_INTEROP</code>鐜鍙橀噺鏉ョ‘瀹氳杩炴帴鐨勬湇鍔″櫒銆傚鏋滄湭璁剧疆璇ュ彉閲忥紝<code>/init</code>浼氬皾璇�<code>/run/WSL/${pid}_interop</code>浣跨敤鑷韩鐨勮繘绋� ID (PID) 杩炴帴鍒版湇鍔″櫒銆傚鏋滆繛鎺ュけ璐ワ紝<code>/init</code>鍒欎細灏濊瘯杩炴帴鍏剁埗杩涚▼鐨勮繘绋� ID锛岀劧鍚庣户缁悜涓婃煡鎵撅紝鐩村埌鎵惧埌<code>init</code> 杩涚▼銆�</p><p>杩炴帴鎴愬姛鍚庯紝<code>/init</code>浼氬彂閫佷竴涓�<code>LxInitMessageCreateProcess</code>锛圵SL1锛夋垨<code>LxInitMessageCreateProcessUtilityVm</code>锛圵SL2锛夛紝鐒跺悗灏嗚娑堟伅杞彂缁欏叧鑱旂殑 Windows 杩涚▼锛岃杩涚▼灏嗗惎鍔ㄨ姹傜殑鍛戒护骞跺皢鍏惰緭鍑鸿浆鍙戠粰<code>/init</code>銆�<a href=\"https://wsl.dev/technical-documentation/interop/\">^1</a></p><p>涔嬪悗鐨勬搷浣滈兘鍦╳indows涓婃墽琛屼簡锛寃indows绋嬪簭鏍规嵁鍙傛暟鍘诲共娲伙紝鐒跺悗鎶婂弬鏁板彂鍥炲幓锛寃sl閲岄潰鐨刬nit鎷垮埌閫€鍑虹爜鍜岃繑