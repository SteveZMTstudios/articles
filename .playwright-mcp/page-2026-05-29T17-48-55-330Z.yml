inux &#x8fdb;&#x7a0b;&#x53ef;&#x4ee5;&#x628a;&#x6253;&#x5f00;&#x7684;&#x6587;&#x4ef6;&#x53e5;&#x67c4;&#x4f20;&#x7ed9; app.exe&#x3002;&#x6bd4;&#x5982; <code>git log | gpg.exe --verify</code>&#xff0c;&#x8fd9;&#x4e2a;&#x7ba1;&#x9053; <code>|</code> &#x662f;&#x7531; Linux &#x5185;&#x6838;&#x7684; <code>pipefs</code> &#x7ba1;&#x7406;&#x7684;&#xff0c;<code>/init</code> &#x4f1a;&#x628a;&#x8fd9;&#x4e2a;&#x7ba1;&#x9053;&#x7684;&#x4e00;&#x7aef;&#x6620;&#x5c04;&#x7ed9; Windows &#x8fdb;&#x7a0b;&#x3002;</li></ul><h2 id=\"&#x6211;&#x4ee5;&#x524d;&#x7684;&#x89e3;&#x51b3;&#x65b9;&#x6848;\"><a href=\"#&#x6211;&#x4ee5;&#x524d;&#x7684;&#x89e3;&#x51b3;&#x65b9;&#x6848;\" class=\"headerlink\" title=\"&#x6211;&#x4ee5;&#x524d;&#x7684;&#x89e3;&#x51b3;&#x65b9;&#x6848;\"/>&#x6211;&#x4ee5;&#x524d;&#x7684;&#x89e3;&#x51b3;&#x65b9;&#x6848;</h2><p>&#x6211;&#x4ee5;&#x524d;&#x662f;&#x201c;&#x76f8;&#x5f53;&#x4e8e;&#x76f4;&#x63a5;&#x628a;yubikey&#x585e;&#x8fdb;wsl&#x865a;&#x62df;&#x673a;&#x201d;&#xff0c;&#x8fd9;&#x79cd;&#x65b9;&#x5f0f;&#x4e5f;&#x9002;&#x5408;&#x50cf;&#x70e7;&#x5f55;&#x56fa;&#x4ef6;&#x8fd9;&#x79cd;&#x6700;&#x597d;&#x76f4;&#x63a5;&#x63a7;&#x5236;usb&#x7684;&#x7a0b;&#x5e8f;</p><p>Windows &#x4fa7;<br/>&#x5b89;&#x88c5; usbipd-win&#xff1a;<br/>&#x5728;&#x7ba1;&#x7406;&#x5458; PowerShell &#x4e2d;&#x6267;&#x884c;&#xff1a;</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">winget install <span class=\"literal\">--interactive</span> <span class=\"literal\">--exact</span> dorssel.usbipd<span class=\"literal\">-win</span></span><br/></pre></td></tr></table></figure><p>WSL2 &#x4fa7; (&#x4ee5; Ubuntu &#x4e3a;&#x4f8b;)<br/>&#x9700;&#x8981;&#x5b89;&#x88c5; USBIP &#x5ba2;&#x6237;&#x7aef;&#x5de5;&#x5177;&#xff1a;</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/><span class=\"line\">3</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\"><span class=\"built_in\">sudo</span> apt update</span><br/><span class=\"line\"><span class=\"built_in\">sudo</span> apt install linux-tools-generic hwdata</span><br/><span class=\"line\"><span class=\"built_in\">sudo</span> update-alternatives --install /usr/local/bin/usbip usbip /usr/lib/linux-tools/*-generic/usbip 20</span><br/></pre></td></tr></table></figure><ol start=\"2\"><li>&#x7ed1;&#x5b9a;&#x5e76;&#x8fde;&#x63a5; Yubikey<br/>&#x5728; Windows &#x7ba1;&#x7406;&#x5458; PowerShell &#x4e2d;&#x627e;&#x5230; Yubikey&#xff1a;</li></ol><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\"/><br/><span class=\"line\">usbipd list</span><br/></pre></td></tr></table></figure><p>&#x627e;&#x5230;&#x7c7b;&#x4f3c; 1050:0407 Yubikey 4/5 OTP+U2F+CCID &#x7684;&#x884c;&#xff0c;&#x8bb0;&#x4e0b;&#x5176; BUSID&#xff08;&#x4f8b;&#x5982; 4-1&#xff09;&#x3002;</p><p>&#x7ed1;&#x5b9a;&#x8bbe;&#x5907;&#xff08;&#x53ea;&#x9700;&#x64cd;&#x4f5c;&#x4e00;&#x6b21;&#xff09;&#xff1a;</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">usbipd bind <span class=\"literal\">--busid</span> <span class=\"number\">4</span><span class=\"literal\">-1</span></span><br/></pre></td></tr></table></figure><p>&#x8fde;&#x63a5;&#x5230; WSL&#xff1a;</p><figure class=\"highlight powershell\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">usbipd attach <span class=\"literal\">--wsl</span> <span class=\"literal\">--busid</span> <span class=\"number\">4</span><span class=\"literal\">-1</span></span><br/></pre></td></tr></table></figure><p>&#x6ce8;&#xff1a;&#x8fde;&#x63a5;&#x540e;&#xff0c;Windows &#x4fa7;&#x5c06;&#x6682;&#x65f6;&#x65e0;&#x6cd5;&#x8bc6;&#x522b;&#x8be5; Yubikey&#xff0c;&#x76f4;&#x5230;&#x4f60;&#x6267;&#x884c; detach &#x3002;</p><ol start=\"3\"><li>&#x5728; WSL &#x4e2d;&#x914d;&#x7f6e; GPG &#x7b7e;&#x540d;<br/>&#x8fde;&#x63a5;&#x6210;&#x529f;&#x540e;&#xff0c;&#x5728; WSL &#x4e2d;&#x6267;&#x884c; lsusb&#xff0c;&#x4f60;&#x5e94;&#x8be5;&#x80fd;&#x770b;&#x5230; Yubikey&#x3002;</li></ol><p>&#x786e;&#x4fdd;&#x667a;&#x80fd;&#x5361;&#x670d;&#x52a1;&#x8fd0;&#x884c;</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\"><span class=\"built_in\">sudo</span> apt install scdaemon pcscd</span><br/><span class=\"line\"><span class=\"built_in\">sudo</span> service pcscd start</span><br/></pre></td></tr></table></figure><p>&#x68c0;&#x67e5;&#x5361;&#x7247;&#x72b6;&#x6001;&#xff1a;</p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">gpg --card-status</span><br/></pre></td></tr></table></figure><p>&#x5982;&#x679c;&#x8f93;&#x51fa;&#x4e86;&#x4f60;&#x7684; Key &#x4fe1;&#x606f;&#xff08;&#x5305;&#x62ec; Signature key &#x7684; ID&#xff09;&#xff0c;&#x8bf4;&#x660e;&#x786c;&#x4ef6;&#x94fe;&#x8def;&#x5df2;&#x901a;&#x3002;</p><p>&#x914d;&#x7f6e; Git &#x4f7f;&#x7528;&#x8be5; Key&#xff1a;<br/>&#x83b7;&#x53d6; Key ID&#xff1a;<code>gpg --list-secret-keys --keyid-format aaaaaaaaaaaaaaaaaaaaa</code></p><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br/><span class=\"line\">2</span><br/><span class=\"line\">3</span><br/></pre></td><td class=\"code\"><pre><span class=\"line\">git config --global user.signingkey 3745872A953198FE</span><br/><span class=\"line\"/><br/><span class=\"line\">git config --global commit.gpgsign <span class=\"literal\">true</span></span><br/></pre></td></tr></table></figure><p>&#x6d4b;&#x8bd5;&#x7b7e;&#x540d; Commi