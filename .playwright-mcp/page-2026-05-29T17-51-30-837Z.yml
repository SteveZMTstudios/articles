          - text: 一年前多前新入了一个AMD笔记本，算是把老Intel电脑换掉了，而且由于CPU受支持，终于可以装上心心念念的
          - link "brunch ChromeOS" [ref=e252] [cursor=pointer]:
            - /url: https://github.com/sebanc/brunch
          - text: 。
        - paragraph [ref=e253]: 关于怎么安装这里不必多赘述，它自带的文档写得还挺清楚。需注意如果要保留安全启动的话，最好是linux安装然后禁用mokutil的shim额外验证。
        - paragraph [ref=e254]:
          - text: 安装完成之后手机上网开
          - link "热点" [ref=e255] [cursor=pointer]:
            - /url: https://github.com/Mygod/VPNHotspot
          - text: ，网上教程多这里不再讲了。
        - paragraph [ref=e256]: 虽然说 ChromeOS 确实比较依赖国际网络，但是一直连着热点还是太耗费流量了。如果接入宽带或者WiFi的话，此时右下角就会提示“已连接，但无法访问互联网”，而且带着让人讨厌的感叹号。
        - paragraph [ref=e257]:
          - img [ref=e258]
        - paragraph [ref=e259]: 这篇文章就是讲怎么修复这个感叹号的。
        - heading "这是什么这是什么" [level=2] [ref=e260]:
          - link "这是什么":
            - /url: "#%E8%BF%99%E6%98%AF%E4%BB%80%E4%B9%88"
          - text: 这是什么
        - paragraph [ref=e261]: 首先有必要解释一下这个连通性检查是干嘛的，通俗来说就是检查看看你是不是真的连上网，于是它要请求一个空白网站，如果网站正确返回了空白（204），就认为连上网，反之如果返回了页面（200）或重定向（3xx），那么你可能连接到了一个公共wifi，于是拉起登录页面供你完成路由器登录（Captive Portal Login）。
        - paragraph [ref=e262]: 有点像我们打开百度看看网连没连上。
        - paragraph [ref=e263]: 但是如果请求这个端点后很长时间没有响应，或者发现发回了RST，或者请求老是被断开，通常来说因为终结点不大容易下线，那么此时很可能是我们的网络出了问题。于是它就提示“无法连接到互联网”。
        - paragraph [ref=e264]: 然而，谷歌将这个“不大容易下线的终结点”和旧式Android 一样，设置到了 google.com/generate_204 ，而不是哪里都能打开的gstatic.com/generate_204（新AOSP默认用这个）。
        - paragraph [ref=e265]: 但是Android设置这个简单，只要往系统数据库里插两个值就行：
        - figure [ref=e266]:
          - table [ref=e267]:
            - rowgroup [ref=e268]:
              - row "1 2 adb shell settings put global captive_portal_http_url http://cp.cloudflare.com/generate_204 adb shell settings put global captive_portal_https_url https://cp.cloudflare.com/generate_204" [ref=e269]:
                - cell "1 2" [ref=e270]:
                  - generic [ref=e271]:
                    - text: "1"
                    - text: "2"
                - cell "adb shell settings put global captive_portal_http_url http://cp.cloudflare.com/generate_204 adb shell settings put global captive_portal_https_url https://cp.cloudflare.com/generate_204" [ref=e272]:
                  - generic [ref=e273]:
                    - text: adb shell settings put global captive_portal_http_url http://cp.cloudflare.com/generate_204
                    - text: adb shell settings put global captive_portal_https_url https://cp.cloudflare.com/generate_204
        - paragraph [ref=e274]: 一开始以为 ChromeOS 可能和 Android 一样，留一个dbus接口或者什么的供用户直接修改，然而这种东西什么的好像是确实不存在的说。
        - paragraph [ref=e275]:
          - text: 您也可以查看
          - link "https://chromium.googlesource.com/chromiumos/platform2/+/HEAD/shill/" [ref=e276] [cursor=pointer]:
            - /url: https://chromium.googlesource.com/chromiumos/platform2/+/HEAD/shill/
          - text: 核查，ChromeOS 把终结点检查地址
        - paragraph [ref=e277]:
          - strong [ref=e278]: 硬编码到网络管理工具 shill 里面了！
        - paragraph [ref=e279]: 那没办法。他硬编码，我只能硬改。
